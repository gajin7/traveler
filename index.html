<body>
<div id="app">
<header>
  <h1><span class="logoic" id="logoic"></span>Cicerone</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="lang-btn ripple" id="citybtn" onclick="toggleCity()"></button>
    <button class="lang-btn ripple" id="langbtn" onclick="toggleLang()">SR</button>
    <button class="iconbtn ripple" id="infobtn" onclick="showView('info')"></button>
  </div>
</header>
<main>
  <div class="view active" id="view-map">
    <div id="map"></div>
    <div id="searchwrap">
      <div id="searchbox"><span id="searchic"></span><input id="searchinput" autocomplete="off"><button id="searchclear" onclick="clearSearch()">✕</button></div>
      <div id="searchresults"></div>
    </div>
    <div id="foundcard"></div>
  </div>
  <div class="view" id="view-list">
    <div class="chips" id="chips"></div>
    <div id="tourctl"></div>
    <div id="foodctl"></div>
    <div class="cards" id="cards"></div>
  </div>
  <div class="view" id="view-here">
    <div class="herehead"><h2 id="heretitle"></h2><p id="heresub"></p></div>
    <button class="bigbtn ripple" id="herebtn" onclick="locateMe()"><span id="hereic"></span><span id="herebtntxt"></span></button>
    <button class="bigbtn ripple" id="cambtn" style="background:var(--secondary-container);color:var(--on-secondary-container);margin-top:0" onclick="$('camfile').click()"><span id="camic"></span><span id="cambtntxt"></span></button>
    <button class="bigbtn ripple" id="localbtn" style="background:linear-gradient(135deg,#B7791F,#E8A13C);color:#fff;margin-top:0" onclick="openLocalMenu()"><span id="localic"></span><span id="localbtntxt"></span></button>
    <div class="statusline" id="herestatus"></div>
    <div class="cards" id="herecards" style="padding-bottom:8px"></div>
    <div class="suggblock">
      <h3 id="suggtitle"></h3>
      <p id="suggsub"></p>
      <div class="chips" id="intchips" style="padding:10px 0 4px"></div>
      <input id="sugginput" autocomplete="off">
      <button class="abtn primary ripple" id="suggbtn" onclick="getSuggestions()" style="width:100%;margin-top:10px"></button>
      <div class="statusline" id="suggstatus" style="padding:8px 0"></div>
    </div>
    <div class="cards" id="suggcards" style="padding-top:0"></div>
  </div>
  <div class="view" id="view-plan">
    <div id="planview">
      <div id="tourbanner"></div>
      <div id="plansec"></div>
      <div id="ticketsec"></div>
    </div>
  </div>
  <div class="view" id="view-chat">
    <div id="chattop"><button id="chatclear" onclick="clearChat()"></button></div>
    <div id="chatlog"></div>
    <div id="chatbar">
      <button id="chatcam" class="cbtn ripple" onclick="$('camfile').click()"></button>
      <button id="micbtn" class="cbtn ripple" onclick="toggleMic()"></button>
      <input id="chatinput" autocomplete="off">
      <button id="sendbtn" class="ripple" onclick="sendChat()"></button>
    </div>
  </div>
  <div class="view" id="view-info"><div class="infobox" id="infobox"></div></div>
</main>
<nav id="nav"></nav>
</div>

<div id="sheet">
  <div class="hero" id="sheethero"><div class="shade"></div>
    <button class="backbtn ripple" id="backbtn" onclick="closeSheet()"></button>
  </div>
  <div class="sbody">
    <div class="cat" id="sheetcat"></div>
    <h2 id="sheettitle"></h2>
    <div id="sheetrating"></div>
    <div class="actions">
      <button class="abtn primary ripple" id="listenbtn" onclick="speakCurrent()"></button>
      <button class="abtn sec ripple" id="askbtn" onclick="askAboutCurrent()"></button>
      <button class="abtn sec ripple" id="gobtn" onclick="openGoMenu()"></button>
      <button class="abtn sec ripple" id="planbtn" onclick="openPlanMenu()"></button>
      <button class="abtn sec ripple" id="ticketbtn" onclick="openTicketMenu()"></button>
      <button class="abtn sec ripple" id="sharebtn" onclick="shareApp(curPlace ? Lp(curPlace).title : null)"></button>
    </div>
    <div class="story" id="sheetstory"></div>
    <div class="tipbox" id="sheettip"></div>
  </div>
</div>

<div id="speakbar"><div class="t" id="speaktitle"></div><button onclick="stopSpeak()" id="speakstop"></button></div>

<div id="updbar"><div class="t" id="updtxt"></div><button onclick="applyUpdate()" id="updgo"></button></div>
<div id="citybar"><div class="t" id="citytxt"></div><button onclick="acceptCitySwitch()" id="citygo"></button><button onclick="dismissCitySwitch()" style="background:none;padding:9px 6px" id="cityx"></button></div>

<div id="planmenu" onclick="if(event.target===this)closePlanMenu()"><div id="planmenuin"></div></div>

<div id="onboard">
  <div class="ob-in">
    <div class="ob-logo" id="oblogo"></div>
    <h2 id="obtitle"></h2>
    <p id="obsub"></p>
    <div class="ob-feats" id="obfeats"></div>
    <div class="ob-langs" id="oblangs" style="flex-wrap:wrap"></div>
    <button class="abtn primary ripple" id="obstart" onclick="closeOnboard()" style="width:100%;padding:16px;font-size:16px"></button>
  </div>
</div>
<input type="file" id="ticketfile" accept="image/*,application/pdf" style="display:none">
<input type="file" id="camfile" accept="image/*" capture="environment" style="display:none">

<div id="tourbar">
  <div class="tb-info" onclick="openNextStop()">
    <div class="tb-num" id="tbnum"></div>
    <div class="tb-txt"><div class="tb-name" id="tbname"></div><div class="tb-dist" id="tbdist"></div></div>
  </div>
  <button class="tb-btn" id="tbnext" onclick="advanceTour(true)"></button>
  <button class="tb-btn tb-end" id="tbend" onclick="endTour()"></button>
</div>

<script>
const PLACES = [
{id:"palacio-real",cat:"landmark",lat:40.4180,lng:-3.7143,wiki:"Royal Palace of Madrid",wl:"en",
 sr:{title:"Kraljevska palata (Palacio Real)",story:"Stojiš pred najvećom kraljevskom palatom zapadne Evrope — 135.000 kvadrata i preko 3.400 soba. Podignuta je u 18. veku na mestu mavarske tvrđave Alkazar koja je izgorela do temelja na Badnje veče 1734. Kralj Filip V, unuk Luja XIV, hteo je Versaj u Madridu — i skoro ga je dobio. Španska kraljevska porodica ovde više ne živi (žive u skromnijoj palati Zarzuela), pa je palata otvorena za posete: raskošne dvorane, kraljevska oružarnica i jedina kompletna Stradivarijeva kolekcija gudačkih instrumenata na svetu. Pogledaj smenu straže sredom i subotom pre podne.",tip:"Odmah pored je park Campo del Moro — najlepši pogled na palatu, a skoro niko od turista ne silazi do njega."},
 en:{title:"Royal Palace (Palacio Real)",story:"You're standing before the largest royal palace in Western Europe — 135,000 square meters and over 3,400 rooms. It was built in the 18th century on the site of the Moorish Alcázar fortress, which burned to the ground on Christmas Eve 1734. King Philip V, grandson of Louis XIV, wanted a Versailles in Madrid — and nearly got one. The Spanish royal family no longer lives here (they live in the more modest Zarzuela Palace), so it's open to visitors: lavish halls, the Royal Armoury, and the world's only complete Stradivarius string quintet. Catch the changing of the guard on Wednesday and Saturday mornings.",tip:"Right next door is Campo del Moro park — the best view of the palace, and almost no tourists ever walk down to it."}},
{id:"almudena",cat:"landmark",lat:40.4157,lng:-3.7144,wiki:"Almudena Cathedral",wl:"en",
 sr:{title:"Katedrala Almudena",story:"Madrid je vekovima bio prestonica bez katedrale — građena je punih 110 godina i završena tek 1993, kada ju je osvештао papa Jovan Pavle II. Spolja neoklasična da se slaže sa palatom preko puta, iznutra iznenađujuće moderna: šareni pop-art plafoni kakve nećeš videti ni u jednoj drugoj katedrali Evrope. Ime nosi po Bogorodici od Almudene, zaštitnici Madrida — legenda kaže da je njena ikona bila sakrivena u zidinama grada tokom mavarske vladavine i pronađena kad se deo zida srušio. Ovde su se 2004. venčali kralj Felipe VI i kraljica Leticija.",tip:"Popni se na kupolu (ulaz kroz muzej) — pogled na palatu i planine Gvadarama je odličan, a gužve nema."},
 en:{title:"Almudena Cathedral",story:"Madrid was a capital without a cathedral for centuries — this one took 110 years to build and was only finished in 1993, consecrated by Pope John Paul II. Neoclassical outside to match the palace across the plaza, surprisingly modern inside: colorful pop-art ceilings unlike any other cathedral in Europe. It's named after the Virgin of Almudena, Madrid's patroness — legend says her icon was hidden inside the city walls during Moorish rule and revealed when a section of wall collapsed. King Felipe VI and Queen Letizia were married here in 2004.",tip:"Climb up to the dome (entry through the museum) — a great view of the palace and the Guadarrama mountains, with no crowds."}},
{id:"plaza-mayor",cat:"landmark",lat:40.4155,lng:-3.7074,wiki:"Plaza Mayor, Madrid",wl:"en",
 sr:{title:"Plaza Mayor",story:"Glavni trg Madrida od 1619. — i pozornica cele njegove istorije. Ovde su se održavale krunidbe, borbe bikova, javna suđenja inkvizicije i pogubljenja, a danas ulični svirači i slikari. Trg je tri puta goreo; današnji izgled sa 237 balkona duguje arhitekti Huanu de Viljanuevi. Konjanik u sredini je Filip III, kralj koji je trg i naručio. Freske na fasadi Casa de la Panadería (nekadašnje glavne pekare) dodane su tek 1992. Ispod arkada su radnje i kafići — turistički i precenjeni, ali atmosfera zimskog božićnog vašara ili letnje večeri ovde je nezamenljiva.",tip:"Bocadillo de calamares (sendvič sa lignjama) je madridski ritual — ali ne kupuj ga na samom trgu, nego iza ćoška u Calle Botoneras, kod 'La Campana'."},
 en:{title:"Plaza Mayor",story:"Madrid's main square since 1619 — and the stage of its entire history. Coronations, bullfights, Inquisition trials and public executions all happened here; today it's street musicians and painters. The square burned down three times; its current look with 237 balconies is owed to architect Juan de Villanueva. The horseman in the middle is Philip III, the king who commissioned it. The frescoes on the Casa de la Panadería (the old main bakery) were only added in 1992. Under the arcades are shops and cafés — touristy and overpriced, but the atmosphere of a winter Christmas market or a summer evening here is irreplaceable.",tip:"A bocadillo de calamares (fried squid sandwich) is a Madrid ritual — but don't buy it on the square itself; go around the corner to Calle Botoneras, to 'La Campana'."}},
{id:"puerta-del-sol",cat:"landmark",lat:40.4169,lng:-3.7035,wiki:"Puerta del Sol",wl:"en",
 sr:{title:"Puerta del Sol",story:"Kilometar nula — tačka od koje se mere svi putevi u Španiji, obeležena pločom na trotoaru ispred stare pošte. Sol je srce grada i mesto gde Španija dočekuje Novu godinu: milioni gledaju prenos sa ovog trga dok jedu 12 zrna grožđa uz 12 otkucaja sata. Statua medveda koji se propinje uz drvo maginje (El Oso y el Madroño) je simbol Madrida — svi zakazuju sastanke 'kod medveda'. Sa ovog trga je 1808. počeo ustanak protiv Napoleona koji je Goja ovekovečio na slikama Drugi i Treći maj — obe ih čekaš u Pradu.",tip:"Stani na ploču 'Kilómetro Cero' — Madridjani veruju da to donosi povratak u Madrid."},
 en:{title:"Puerta del Sol",story:"Kilometre Zero — the point from which all roads in Spain are measured, marked by a plaque in the pavement in front of the old post office. Sol is the heart of the city and where Spain celebrates New Year's Eve: millions watch the broadcast from this square while eating 12 grapes to the 12 chimes of the clock. The statue of the bear reaching up a strawberry tree (El Oso y el Madroño) is the symbol of Madrid — everyone arranges to meet 'at the bear'. The 1808 uprising against Napoleon began on this square — Goya immortalized it in his Second and Third of May paintings, both waiting for you at the Prado.",tip:"Stand on the 'Kilómetro Cero' plaque — Madrileños say it guarantees you'll return to Madrid."}},
{id:"prado",cat:"museum",lat:40.4138,lng:-3.6921,wiki:"Museo del Prado",wl:"en",
 sr:{title:"Muzej Prado",story:"Jedan od tri-četiri najveća muzeja slikarstva na svetu. Ovde je španska kraljevska kolekcija: Velaskezove 'Mlade plemkinje' (Las Meninas) — slika o kojoj se raspravlja 350 godina jer nije jasno ko koga gleda; Gojina 'Obnažena Maha' zbog koje je odgovarao pred inkvizicijom, i njegove 'Crne slike', naslikane na zidovima sopstvene kuće u starosti — najmračnije stvari ikad naslikane. Tu su i Bošov 'Vrt uživanja', El Greko, Ticijan, Rubens. Ne pokušavaj da vidiš sve — odaberi Velaskeza, Goju i Boša, i to je već pun dan.",tip:"Poslednja dva sata pred zatvaranje (pon–sub od 18h, ned od 17h) ulaz je besplatan — red krene ranije, stani na vreme."},
 en:{title:"Prado Museum",story:"One of the three or four greatest painting museums in the world. This is the Spanish royal collection: Velázquez's Las Meninas — a painting debated for 350 years because nobody agrees on who is looking at whom; Goya's Naked Maja, which got him summoned before the Inquisition, and his Black Paintings, painted on the walls of his own house in old age — the darkest things ever put on canvas. There's also Bosch's Garden of Earthly Delights, El Greco, Titian, Rubens. Don't try to see everything — pick Velázquez, Goya and Bosch, and that's already a full day.",tip:"The last two hours before closing (Mon–Sat from 6pm, Sun from 5pm) are free — the queue forms early, get in line in time."}},
{id:"reina-sofia",cat:"museum",lat:40.4080,lng:-3.6946,wiki:"Museo Reina Sofía",wl:"en",
 sr:{title:"Muzej Reina Sofija",story:"Muzej moderne umetnosti smešten u bivšoj bolnici iz 18. veka — i dom najpotresnije slike 20. veka: Pikasove 'Gernike'. Naslikana 1937. za Svetsku izložbu u Parizu, kao odgovor na nemačko bombardovanje baskijskog gradića Gernike, slika je decenijama bila u Njujorku jer je Pikaso zabranio da uđe u Španiju dok je Franko živ. Vratila se tek 1981. Oko nje su skice i fotografije nastanka — ceo jedan zid procesa. U ostatku muzeja: Dali, Miro, španska avangarda.",tip:"Ako te zanima samo Gernika: druga je sprat, sala 205. Radnim danom u vreme ručka (14–16h) je najprazjnije."},
 en:{title:"Reina Sofía Museum",story:"Madrid's modern art museum, housed in a former 18th-century hospital — and home to the most devastating painting of the 20th century: Picasso's Guernica. Painted in 1937 for the Paris World's Fair in response to the German bombing of the Basque town of Guernica, it spent decades in New York because Picasso forbade it from entering Spain while Franco lived. It only came home in 1981. Around it hang the sketches and photographs of its creation — an entire wall of process. Elsewhere in the museum: Dalí, Miró, and the Spanish avant-garde.",tip:"If you only want Guernica: second floor, room 205. Weekday lunchtime (2–4pm) is quietest."}},
{id:"thyssen",cat:"museum",lat:40.4160,lng:-3.6949,wiki:"Thyssen-Bornemisza Museum",wl:"en",
 sr:{title:"Muzej Tisen-Bornemisa",story:"Treći ugao madridskog 'zlatnog trougla umetnosti' — i najlakši za gledanje. Ovo je bila privatna kolekcija porodice Tisen, industrijskih magnata, koju je Španija otkupila 1993. Za razliku od Prada (stari majstori) i Reina Sofije (moderna), Tisen pokriva sve: od italijanskih primitivaca preko holandskih majstora do impresionista, ekspresionista i američkog pop-arta. Mone, Van Gog, Kandinski, Hoper — sve pod jednim krovom, hronološki poređano tako da za dva sata prošetaš kroz 700 godina slikarstva.",tip:"Kreni od vrha (2. sprat, stari majstori) nadole ka 20. veku — tako je kolekcija i zamišljena."},
 en:{title:"Thyssen-Bornemisza Museum",story:"The third corner of Madrid's 'golden triangle of art' — and the easiest to enjoy. This was the private collection of the Thyssen family, industrial magnates, purchased by Spain in 1993. Unlike the Prado (old masters) and Reina Sofía (modern), the Thyssen covers everything: from Italian primitives through Dutch masters to Impressionists, Expressionists and American pop art. Monet, Van Gogh, Kandinsky, Hopper — all under one roof, arranged chronologically so that in two hours you walk through 700 years of painting.",tip:"Start from the top (2nd floor, old masters) and work down to the 20th century — that's how the collection was designed to be seen."}},
{id:"retiro",cat:"park",lat:40.4153,lng:-3.6844,wiki:"Buen Retiro Park",wl:"en",
 sr:{title:"Park Retiro",story:"Zelena pluća Madrida — 125 hektara koji su do 1868. bili privatni vrt kraljeva. Ime znači 'povlačenje': ovde se dvor povlačio iz grada. Centar parka je veliko jezero sa čamcima na iznajmljivanje, nad kojim bdi ogroman spomenik Alfonsu XII. Nedeljom se ceo Madrid slije ovde: porodice, bubnjari, klizači, prodavci knjiga. Potraži Palacio de Cristal — staklenu palatu iz 1887. podignutu za izložbu biljaka sa Filipina, danas izložbeni prostor Reina Sofije. I ne propusti Ružičnjak (La Rosaleda) i 'Statuu Palog anđela' — navodno jedini javni spomenik đavolu na svetu, na tačno 666 m nadmorske visine.",tip:"Čamac na jezeru pre podne radnim danom — 8 evra, bez reda, i najlepše svetlo za slike."},
 en:{title:"Retiro Park",story:"Madrid's green lungs — 125 hectares that were the kings' private garden until 1868. The name means 'retreat': this is where the court withdrew from the city. At its center is the great boating lake watched over by the huge monument to Alfonso XII. On Sundays all of Madrid pours in: families, drummers, skaters, booksellers. Seek out the Palacio de Cristal — a glass palace from 1887 built for an exhibition of plants from the Philippines, now an exhibition space of the Reina Sofía. Don't miss the Rose Garden (La Rosaleda) and the Statue of the Fallen Angel — reputedly the world's only public monument to the devil, standing at exactly 666 m above sea level.",tip:"Rent a rowing boat on a weekday morning — 8 euros, no queue, and the best light for photos."}},
{id:"palacio-cristal",cat:"park",lat:40.4132,lng:-3.6822,wiki:"Palacio de Cristal",wl:"en",
 sr:{title:"Palacio de Cristal (Staklena palata)",story:"Najfotogeničnija građevina Madrida. Podignuta 1887. za Izložbu Filipina — tada španske kolonije — kao ogromna staklena bašta za tropske biljke. Arhitekta Rikardo Velaskez Bosko inspirisao se londonskim Kristalnim dvorcem. Danas u njoj Reina Sofija postavlja savremene instalacije, uvek besplatne. Palata stoji nad malim jezerom sa kornjačama i crnim labudovima, okružena kestenovima — kad sunce prođe kroz staklo, unutra sve svetli. Jedno od onih mesta gde staneš i ćutiš.",tip:"Dođi u zlatni sat pred zalazak — staklo se pretvara u vatru. Ulaz je uvek besplatan."},
 en:{title:"Palacio de Cristal (Crystal Palace)",story:"The most photogenic building in Madrid. Erected in 1887 for the Exhibition of the Philippines — then a Spanish colony — as a vast glasshouse for tropical plants. Architect Ricardo Velázquez Bosco was inspired by London's Crystal Palace. Today the Reina Sofía stages contemporary installations here, always free. The palace stands over a small lake with turtles and black swans, ringed by chestnut trees — when sunlight passes through the glass, everything inside glows. One of those places where you just stop and go quiet.",tip:"Come at golden hour before sunset — the glass turns to fire. Entry is always free."}},
{id:"puerta-alcala",cat:"landmark",lat:40.4200,lng:-3.6889,wiki:"Puerta de Alcalá",wl:"en",
 sr:{title:"Puerta de Alkala",story:"Trijumfalna kapija iz 1778. — starija i od Brandenburške kapije i od pariske Trijumfalne. Naručio ju je kralj Karlos III, veliki graditelj Madrida, od italijanskog arhitekte Sabatinija, kao svečani ulaz u grad sa istoka, na putu iz Alkale de Enares. Pogledaj pažljivo dve strane: različite su, jer je Sabatini kralju poslao dva nacrta, a ovaj je odobrio — oba, ne primetivši. Na kamenu se i danas vide ožiljci od gelera iz građanskog rata.",tip:"Najlepša je noću, osvetljena, sa ivice parka Retiro."},
 en:{title:"Puerta de Alcalá",story:"A triumphal gate from 1778 — older than both the Brandenburg Gate and the Arc de Triomphe. King Carlos III, Madrid's great builder, commissioned it from the Italian architect Sabatini as a ceremonial eastern entrance to the city, on the road from Alcalá de Henares. Look closely at the two faces: they're different, because Sabatini sent the king two designs and he approved — both, without noticing. The stone still bears shrapnel scars from the Civil War.",tip:"It's most beautiful at night, lit up, seen from the edge of Retiro Park."}},
{id:"gran-via",cat:"landmark",lat:40.4200,lng:-3.7058,wiki:"Gran Vía",wl:"en",
 sr:{title:"Gran Vija",story:"Madridski Brodvej. Probijena kroz staro gradsko tkivo između 1910. i 1929. — srušeno je preko 300 zgrada da bi grad dobio svoju veliku modernu aveniju. Ovde su prve 'oblakoderske' zgrade Španije: Telefónica (1929) bila je najviša zgrada Evrope, a sa njenog krova se za vreme građanskog rata osmatralo bombardovanje. Zgrada Metropolis na početku avenije, sa krilatom Viktorijom na kupoli, jedna je od najslikanijih u Evropi. Danas su tu pozorišta sa mjuziklima, bioskopi i radnje — struja ljudi ne prestaje ni u 3 ujutru.",tip:"Popni se na krovnu terasu robne kuće El Corte Inglés kod Kalao (Gourmet Experience, 9. sprat) — besplatan pogled duž cele avenije."},
 en:{title:"Gran Vía",story:"Madrid's Broadway. Carved through the old city fabric between 1910 and 1929 — over 300 buildings were demolished to give the city its great modern avenue. Spain's first 'skyscrapers' rose here: the Telefónica building (1929) was Europe's tallest, and during the Civil War its roof served as an observation post during bombardments. The Metropolis building at the avenue's start, with its winged Victory on the dome, is one of the most photographed in Europe. Today it's musical theatres, cinemas and shops — the river of people never stops, even at 3am.",tip:"Go up to the rooftop of the El Corte Inglés at Callao (Gourmet Experience, 9th floor) — a free view down the whole avenue."}},
{id:"templo-debod",cat:"landmark",lat:40.4240,lng:-3.7178,wiki:"Temple of Debod",wl:"en",
 sr:{title:"Hram Debod",story:"Pravi egipatski hram, star 2.200 godina, usred madridskog parka. Kako? Kad je Egipat šezdesetih gradio Asuansku branu, Nil je trebalo da potopi drevne hramove Nubije. UNESCO je organizovao spasavanje, Španija poslala inženjere — i Egipat joj se 1968. odužio poklonivši ceo hram Debod, kamen po kamen. Posvećen je bogovima Amonu i Izidi. Danas stoji na mestu bivše kasarne Montaña, gde su 1936. streljani branioci republike — mesto duplog sećanja.",tip:"Ovo je najčuveniji sunset spot Madrida — zauzmi mesto na zapadnoj strani bar pola sata pre zalaska."},
 en:{title:"Temple of Debod",story:"A genuine Egyptian temple, 2,200 years old, in the middle of a Madrid park. How? When Egypt built the Aswan Dam in the sixties, the Nile was set to drown the ancient temples of Nubia. UNESCO organized a rescue, Spain sent engineers — and in 1968 Egypt repaid the favor by gifting the entire Temple of Debod, stone by stone. It's dedicated to the gods Amun and Isis. It now stands on the site of the former Montaña barracks, where defenders of the Republic were executed in 1936 — a place of double memory.",tip:"This is Madrid's most famous sunset spot — claim a place on the west side at least half an hour before sundown."}},
{id:"plaza-espana",cat:"landmark",lat:40.4234,lng:-3.7122,wiki:"Plaza de España, Madrid",wl:"en",
 sr:{title:"Plaza de Espanja",story:"Veliki trg na kraju Gran Vije, renoviran 2021. u zelenu pešačku oazu. U centru je spomenik Servantesu iz 1929: pisac sedi u kamenu, a ispod njega u bronzi jašu njegovi besmrtni junaci — Don Kihot na Rosinantu i Sančo Pansa na magarcu. Iza trga se dižu dva džina iz Frankove ere: Edificio España i Torre de Madrid, pedesetih najviše zgrade Evrope. Odavde ti je sve blizu: Templo Debod na 5 minuta, Kraljevska palata na 10, a žičara za Casa de Campo odmah iza ugla.",tip:"Fotka sa Don Kihotom je obavezna — ali dođi pre 10h da ne čekaš red."},
 en:{title:"Plaza de España",story:"The great square at the end of Gran Vía, renovated in 2021 into a green pedestrian oasis. At its center stands the 1929 monument to Cervantes: the writer sits in stone while below him his immortal heroes ride in bronze — Don Quixote on Rocinante and Sancho Panza on his donkey. Behind the square rise two giants of the Franco era: the Edificio España and Torre de Madrid, the tallest buildings in Europe in the fifties. Everything is close from here: Temple of Debod 5 minutes away, the Royal Palace 10, and the cable car to Casa de Campo just around the corner.",tip:"The photo with Don Quixote is mandatory — but come before 10am to avoid the queue."}}
];

const PLACES2 = [
{id:"cibeles",cat:"landmark",lat:40.4193,lng:-3.6932,wiki:"Plaza de Cibeles",wl:"en",
 sr:{title:"Plaza de Sibeles",story:"Fontana boginje Kibele u kočiji koju vuku lavovi — simbol Madrida od 1782. i sveto mesto navijača Real Madrida, koji ovde slave svaku titulu (kada slavi Atletiko, ide na obližnji Neptun). Iza fontane se diže Palacio de Cibeles — katedrala od zgrade koja je do 2007. bila... glavna pošta. Madriđani se i danas šale da imaju najlepšu poštu na svetu. Danas je to gradska većnica sa kulturnim centrom CentroCentro i vidikovcem na 8. spratu.",tip:"Vidikovac na krovu palate (Mirador Madrid) — par evra, a pogled na Gran Viju i Alkalu je među najboljima u gradu."},
 en:{title:"Plaza de Cibeles",story:"The fountain of the goddess Cybele in a chariot drawn by lions — a symbol of Madrid since 1782 and sacred ground for Real Madrid fans, who celebrate every title here (when Atlético win, they go to nearby Neptune). Behind the fountain rises the Palacio de Cibeles — a cathedral of a building that until 2007 was... the main post office. Madrileños still joke they have the world's most beautiful post office. Today it's the City Hall with the CentroCentro cultural space and an 8th-floor viewpoint.",tip:"The rooftop viewpoint (Mirador Madrid) — a few euros, and the view over Gran Vía and Alcalá is among the best in the city."}},
{id:"bernabeu",cat:"landmark",lat:40.4531,lng:-3.6883,wiki:"Santiago Bernabéu Stadium",wl:"en",
 sr:{title:"Stadion Santjago Bernabeu",story:"Hram Real Madrida, kluba sa najviše evropskih titula u istoriji fudbala. Otvoren 1947. i nazvan po predsedniku koji ga je sagradio, upravo je prošao renovaciju od preko milijardu evra: futuristički omotač od čelika, krov koji se zatvara i teren koji se — celi — spušta pod zemlju da bi stadion primao koncerte. Obilazak (Bernabéu Tour) te vodi kroz muzej sa svih 15 Liga šampiona, svlačionicu i izlaz na teren kroz tunel. I ako nisi navijač, inženjerija je vredna gledanja.",tip:"Kupi kartu za turu online unapred — na blagajni je red, a termini za popodne se popune."},
 en:{title:"Santiago Bernabéu Stadium",story:"The temple of Real Madrid, the most decorated club in European football history. Opened in 1947 and named after the president who built it, it has just emerged from a billion-euro renovation: a futuristic steel skin, a closing roof, and a pitch that — in its entirety — retracts underground so the stadium can host concerts. The Bernabéu Tour takes you through the museum with all 15 Champions League trophies, the dressing room, and out through the players' tunnel. Even if you're not a fan, the engineering alone is worth seeing.",tip:"Buy the tour ticket online in advance — the box office queue is long and afternoon slots sell out."}},
{id:"las-ventas",cat:"landmark",lat:40.4320,lng:-3.6633,wiki:"Las Ventas",wl:"en",
 sr:{title:"Arena Las Ventas",story:"Najveća koridа-arena Španije i 'katedrala' borbi s bikovima — 23.798 mesta, neomudehar stil sa keramičkim grbovima svih španskih provincija. Otvorena 1931. Za toreadore, nastup ovde je kao Skala za operske pevače: ko trijumfuje na Las Ventasu, iznesu ga kroz Velika vrata na ramenima. Sezona traje od marta do oktobra, vrhunac je festival San Isidro u maju–junu. Korida je danas duboko sporna i mnogi je Španci odbacuju — ali arena se može obići i mimo borbi, uz audio-turu kroz istoriju.",tip:"Ako te korida ne zanima, arhitektura i muzej vrede posete — metro Ventas te ostavlja na 50 metara."},
 en:{title:"Las Ventas Bullring",story:"Spain's largest bullring and the 'cathedral' of bullfighting — 23,798 seats in Neo-Mudéjar style, with ceramic coats of arms of every Spanish province. Opened in 1931. For toreros, performing here is like La Scala for opera singers: whoever triumphs at Las Ventas is carried out through the Great Gate on shoulders. The season runs March to October, peaking during the San Isidro festival in May–June. Bullfighting is deeply controversial today and many Spaniards reject it — but the arena can be visited outside the fights, with an audio tour through its history.",tip:"Even if bullfighting isn't for you, the architecture and museum are worth the trip — Ventas metro drops you 50 meters away."}},
{id:"san-francisco",cat:"landmark",lat:40.4108,lng:-3.7146,wiki:"Basilica of San Francisco el Grande, Madrid",wl:"en",
 sr:{title:"Bazilika San Francisko el Grande",story:"Spolja stroga, iznutra zapanjujuća: kupola prečnika 33 metra — treća najveća kružna kupola Evrope, posle rimskog Panteona i firentinske katedrale. Legenda kaže da je crkvu osnovao sam Sveti Franja Asiški 1217. na proputovanju kroz Španiju. Današnja građevina je iz 18. veka; u kapeli San Bernardino visi slika koju je naslikao mladi Goja — i u masi likova prokrijumčario sopstveni autoportret (dečak u žutom, desno). Enterijer je od poda do kupole u freskama.",tip:"Uđi obavezno — spoljašnjost ne odaje ništa od onoga što te čeka unutra."},
 en:{title:"Basilica of San Francisco el Grande",story:"Austere outside, astonishing inside: a dome 33 meters across — the third-largest circular dome in Europe, after the Roman Pantheon and Florence's cathedral. Legend has it the church was founded by Saint Francis of Assisi himself in 1217 while traveling through Spain. The present building is 18th-century; in the San Bernardino chapel hangs a painting by the young Goya — who smuggled his own self-portrait into the crowd (the boy in yellow, on the right). The interior is frescoed from floor to dome.",tip:"Make sure you go in — the exterior gives away nothing of what awaits inside."}},
{id:"rastro",cat:"quarter",lat:40.4086,lng:-3.7073,wiki:"El Rastro",wl:"en",
 sr:{title:"El Rastro (buvlja pijaca)",story:"Svake nedelje i praznika od 9 do 15h, ulica Ribera de Curtidores i sve oko nje pretvore se u najveću buvlju pijacu Španije — tradicija stara preko 400 godina. Ime 'rastro' (trag) potiče od krvavog traga koji su ostavljale životinje vučene iz klanica koje su nekad bile ovde. Danas: starine, ploče, koža, vintage garderoba, kič i blago pomešani. Pravilo je da se cenkaš. Posle pijace ceo kraj seli u barove La Latine na vermut — to je madridski nedeljni ritual koji ne smeš propustiti.",tip:"Dođi pre 11h dok nije gužva, drži torbu napred, i završi na Plaza de Cascorro uz vermut."},
 en:{title:"El Rastro (flea market)",story:"Every Sunday and holiday from 9am to 3pm, Ribera de Curtidores street and everything around it becomes Spain's biggest flea market — a tradition over 400 years old. The name 'rastro' (trail) comes from the bloody trail left by animals dragged from the slaughterhouses once located here. Today: antiques, vinyl, leather, vintage clothes, kitsch and treasure all mixed together. Haggling is the rule. Afterwards the whole neighborhood migrates to the bars of La Latina for vermouth — Madrid's Sunday ritual you must not miss.",tip:"Come before 11am to beat the crowds, keep your bag in front, and finish at Plaza de Cascorro with a vermouth."}},
{id:"la-latina",cat:"quarter",lat:40.4118,lng:-3.7089,wiki:"La Latina (Madrid)",wl:"en",
 sr:{title:"La Latina (kvart)",story:"Najstariji deo Madrida — srednjovekovne uličice na mestu nekadašnje mavarske četvrti. Danas je ovo prestonica tapasa: Cava Baja, ulica od 300 metara sa preko 50 barova, verovatno najveća gustina tapas-barova na svetu. Ritual je 'tapeo': u svakom baru jedno piće i jedna tapa, pa dalje. Nedeljom posle Rastra ovde ne možeš da se okreneš od ljudi. Proveri i Plaza de la Paja, najlepši srednjovekovni trg grada, tih i zelen — na njemu je i vrt Prinčevo dvorište (Jardín del Príncipe de Anglona), skriveni dragulj.",tip:"Kreni sa Cava Baja oko 13h ili 20h30 — pre špica. Huevos rotos kod Lucija, tortilja kod Juane la Loce."},
 en:{title:"La Latina (quarter)",story:"The oldest part of Madrid — medieval lanes on the site of the former Moorish quarter. Today it's the capital of tapas: Cava Baja, a 300-meter street with over 50 bars, probably the highest density of tapas bars in the world. The ritual is the 'tapeo': one drink and one tapa in each bar, then move on. On Sundays after the Rastro you can barely move here. Also check Plaza de la Paja, the city's loveliest medieval square, quiet and green — home to the hidden gem Jardín del Príncipe de Anglona.",tip:"Start on Cava Baja around 1pm or 8:30pm — before the rush. Huevos rotos at Lucio's, tortilla at Juana la Loca."}},
{id:"malasana",cat:"quarter",lat:40.4272,lng:-3.7045,wiki:"Malasaña",wl:"en",
 sr:{title:"Malasanja (kvart)",story:"Kvart pobune. Ovde je 2. maja 1808. počeo ustanak protiv Napoleona — centralni trg se zove Dos de Mayo, po tom danu, a kvart po Manueli Malasanji, petnaestogodišnjoj švalji koja je postala mučenica ustanka. Sto sedamdeset godina kasnije, osamdesetih, Malasanja je bila epicentar Movide — eksplozije slobode posle Frankove smrti: pank, novi talas, Almodovar. Danas je to kvart vintage radnji, nezavisnih kafića, murala i barova koji ne stare. Doručak u kultnom Pepe Botella ili Lolina Vintage Café, pa lutanje ulicama Espíritu Santo i Velarde.",tip:"Uveče traži bar La Vía Láctea — živi ostatak Movide, otvoren od 1979."},
 en:{title:"Malasaña (quarter)",story:"The neighborhood of rebellion. The uprising against Napoleon began here on May 2nd, 1808 — the central square is called Dos de Mayo after that day, and the quarter is named after Manuela Malasaña, a fifteen-year-old seamstress who became a martyr of the revolt. A hundred and seventy years later, in the eighties, Malasaña was the epicenter of the Movida — the explosion of freedom after Franco's death: punk, new wave, Almodóvar. Today it's vintage shops, indie cafés, murals and ageless bars. Breakfast at the iconic Pepe Botella or Lolina Vintage Café, then wander Espíritu Santo and Velarde streets.",tip:"At night find La Vía Láctea — a living relic of the Movida, open since 1979."}},
{id:"chueca",cat:"quarter",lat:40.4223,lng:-3.6977,wiki:"Chueca",wl:"en",
 sr:{title:"Čueka (kvart)",story:"Kvart koji je sam sebe spasao. Osamdesetih zapušten i opasan, Čueku je preporodila LGBT zajednica koja ga je pretvorila u jedan od najživljih i najotvorenijih kvartova Evrope — madridski Pride, jedan od najvećih na svetu, ovde kulminira svakog jula. Oko trga Plaza de Chueca su barovi koji rade do zore, a u okolnim ulicama dizajnerske radnje, koncept-storovi i Mercado de San Antón — moderna pijaca sa krovnom terasom. Ovo je i kvart za izlazak: od klasičnih taverni do koktel barova svetske klase.",tip:"Krovna terasa Mercado de San Antón za piće u suton — pa večera dole na pijaci."},
 en:{title:"Chueca (quarter)",story:"The neighborhood that saved itself. Derelict and dangerous in the eighties, Chueca was reborn thanks to the LGBT community, which turned it into one of Europe's most vibrant and open quarters — Madrid Pride, one of the biggest in the world, culminates here every July. Around Plaza de Chueca the bars run till dawn, and the surrounding streets hold designer shops, concept stores and the Mercado de San Antón — a modern market with a rooftop terrace. This is also prime going-out territory: from classic taverns to world-class cocktail bars.",tip:"The San Antón market rooftop for a drink at dusk — then dinner downstairs in the market."}},
{id:"letras",cat:"quarter",lat:40.4142,lng:-3.6990,wiki:"Barrio de las Letras",wl:"en",
 sr:{title:"Kvart književnika (Barrio de las Letras)",story:"U ovih par ulica živeo je zlatni vek španske književnosti: Servantes, Lope de Vega, Kevedo i Gongora — komšije i ljuti rivali. Servantes je umro u ulici koja danas nosi ime njegovog rivala Lopea de Vege, a Lope je živeo u ulici Servantes. Po trotoarima glavne ulice Calle Huertas u bronzi su utisnuti citati velikih pisaca. Servantes je sahranjen u obližnjem manastiru Trinitarki — grob mu je pronađen tek 2015. Danas je kvart pun književnih kafića, malih pozorišta i tapas-barova, elegantniji i mirniji od La Latine.",tip:"Casa de Lope de Vega (besplatna poseta) — kuća pisca očuvana kakva je bila u 17. veku, sa baštom."},
 en:{title:"Literary Quarter (Barrio de las Letras)",story:"Spain's Golden Age of literature lived in these few streets: Cervantes, Lope de Vega, Quevedo and Góngora — neighbors and bitter rivals. Cervantes died on the street that now bears his rival Lope de Vega's name, while Lope lived on Cervantes street. Quotes from the great writers are set in bronze into the pavement of the main street, Calle Huertas. Cervantes is buried in the nearby Trinitarias convent — his grave was only identified in 2015. Today the quarter is full of literary cafés, small theatres and tapas bars, more elegant and quieter than La Latina.",tip:"Casa de Lope de Vega (free visit) — the writer's house preserved as it was in the 17th century, garden included."}},
{id:"lavapies",cat:"quarter",lat:40.4088,lng:-3.7010,wiki:"Lavapiés",wl:"en",
 sr:{title:"Lavapijes (kvart)",story:"Najšareniji kvart Madrida — na jednoj ulici indijski restorani, senegalske kafane, kineske prodavnice i stare kastiljanske taverne. Vekovima kvart radnika i doseljenika, danas i kvart umetnosti: ulični murali na svakom ćošku (projekat Muros Tabacalera), squat-galerije, i La Tabacalera — bivša fabrika duvana pretvorena u društveni i umetnički centar. Tu je i Cine Doré, prelepi bioskop iz 1922. u kom Španska kinoteka pušta klasike za 3 evra. Autentičan, živ, pomalo sirov — Madrid kakav turisti retko vide.",tip:"Nedeljom uveče: indijska večera u ulici Lavapiés, pa piće na trgu — kvart tada najlepše diše."},
 en:{title:"Lavapiés (quarter)",story:"Madrid's most colorful quarter — Indian restaurants, Senegalese cafés, Chinese shops and old Castilian taverns on the same street. For centuries the neighborhood of workers and migrants, today it's also the neighborhood of art: street murals on every corner (the Muros Tabacalera project), squat galleries, and La Tabacalera — a former tobacco factory turned social and art center. There's also Cine Doré, a beautiful 1922 cinema where the Spanish Film Archive screens classics for 3 euros. Authentic, alive, a little raw — the Madrid tourists rarely see.",tip:"Sunday evening: Indian dinner on Calle Lavapiés, then a drink on the square — the quarter breathes best then."}},
{id:"botanico",cat:"park",lat:40.4113,lng:-3.6905,wiki:"Real Jardín Botánico de Madrid",wl:"en",
 sr:{title:"Kraljevska botanička bašta",story:"Odmah uz Prado, iza ograde koju većina prođe ne primetivši je: 90.000 biljaka na osam hektara, osnovana 1755. Karlos III je ovde slao botaničare sa ekspedicija po Americi i Pacifiku — herbarijum čuva preko milion primeraka, uključujući i one koje je doneo sam Darvin. Terasasta bašta u tri nivoa, staklenici sa tropskim biljkama, bonsai kolekcija bivšeg premijera... Mir kakav u centru grada ne postoji nigde drugde. Idealna pauza posle Prada, kad ti mozak više ne prima slike.",tip:"Ulaz je par evra, a u proleće kad procveta ružičnjak — ne postoji lepše mesto u gradu."},
 en:{title:"Royal Botanical Garden",story:"Right beside the Prado, behind a fence most people pass without noticing: 90,000 plants across eight hectares, founded in 1755. Carlos III sent botanists here from expeditions across the Americas and the Pacific — the herbarium holds over a million specimens, including some brought back by Darwin himself. A terraced garden on three levels, tropical greenhouses, a bonsai collection donated by a former prime minister... A calm that exists nowhere else in the city center. The perfect pause after the Prado, when your brain can't take any more paintings.",tip:"Entry is a few euros, and in spring when the rose garden blooms — there's no lovelier place in town."}},
{id:"matadero",cat:"quarter",lat:40.3919,lng:-3.6989,wiki:"Matadero Madrid",wl:"en",
 sr:{title:"Matadero Madrid",story:"Gradska klanica iz 1924. pretvorena u jedan od najuzbudljivijih kulturnih centara Evrope. Kompleks od desetak neomudehar paviljona od cigle danas krije pozorišta, izložbene hale, bioskop Cineteca (specijalizovan za dokumentarce), dizajn-centar i ogromnu čitaonicu. Ulaz u prostor je besplatan, program stalno rotira. Nalazi se na obali Мансанареса, na Madrid Río — parku dugom 10 km napravljenom kad je grad zakopao auto-put pod zemlju. Iznajmi bicikl i dođi rekom.",tip:"Subotom popodne: šetnja Madrid Ríom od Puente de Toledo do Matadera, pa program po izboru — sve besplatno."},
 en:{title:"Matadero Madrid",story:"The city slaughterhouse from 1924, converted into one of Europe's most exciting cultural centers. A complex of a dozen Neo-Mudéjar brick pavilions now hides theatres, exhibition halls, the Cineteca cinema (specializing in documentaries), a design center and a huge reading room. Entry to the grounds is free and the program rotates constantly. It sits on the bank of the Manzanares on Madrid Río — a 10-km park created when the city buried its motorway underground. Rent a bike and arrive along the river.",tip:"Saturday afternoon: walk Madrid Río from Puente de Toledo to Matadero, then pick whatever's on — all free."}}
];

const PLACES3 = [
{id:"san-miguel",cat:"food",lat:40.4154,lng:-3.7090,wiki:"Mercado de San Miguel",wl:"en",
 sr:{title:"Mercado de San Migel",story:"Pijaca iz 1916. u prelepoj konstrukciji od livenog gvožđa i stakla — poslednja takva u Madridu. Pre petnaestak godina pretvorena je u gurmanski hram: 20-ak tezgi sa ostrigama, iberijskim pršutom, tapasima, šerijem i vinom. Da budemo iskreni: cene su turističke i Madriđani ovde retko jedu — ali kao uvod u špansku gastronomiju na jednom mestu, sa čašom kave u ruci usred te arhitekture, vredi bar jednom. Radi do ponoći (petkom i subotom do 1h).",tip:"Uzmi jednu stvar sa 3–4 tezge umesto obroka na jednoj — i dođi pre podneva ili posle 23h da izbegneš najveću gužvu."},
 en:{title:"Mercado de San Miguel",story:"A 1916 market hall in a beautiful cast-iron and glass structure — the last of its kind in Madrid. About fifteen years ago it was reborn as a gourmet temple: some 20 stalls with oysters, Ibérico ham, tapas, sherry and wine. Honestly: prices are touristy and locals rarely eat here — but as a one-stop introduction to Spanish gastronomy, glass of cava in hand amid that architecture, it's worth at least one visit. Open till midnight (1am Fri–Sat).",tip:"Take one item from 3–4 different stalls instead of a full meal at one — and come before noon or after 11pm to dodge the worst crowds."}},
{id:"botin",cat:"food",lat:40.4141,lng:-3.7077,wiki:"Sobrino de Botín",wl:"en",
 sr:{title:"Sobrino de Botin",story:"Najstariji restoran na svetu po Ginisovoj knjizi — radi bez prekida od 1725. Kroz ova vrata su prošli Goja (koji je ovde navodno prao sudove pre nego što je postao slikar), Hemingvej (koji je Botin ovekovečio u završnici 'Sunce se ponovo rađa') i tri veka gladnih Madriđana. Specijalitet je cochinillo asado — prase pečeno u originalnoj peći na drva staroj 300 godina, koja se nikad ne gasi. Enterijer sa drvenim gredama i pločicama izgleda kao da se od 18. veka ništa nije promenilo — jer skoro i nije.",tip:"Rezerviši obavezno (dan-dva unapred, online) i traži sto u podrumu — 'la cueva' je najstariji deo."},
 en:{title:"Sobrino de Botín",story:"The world's oldest restaurant according to Guinness — operating continuously since 1725. Through these doors passed Goya (who allegedly washed dishes here before becoming a painter), Hemingway (who immortalized Botín in the closing scene of 'The Sun Also Rises') and three centuries of hungry Madrileños. The specialty is cochinillo asado — suckling pig roasted in the original 300-year-old wood-fired oven, which has never gone out. The beamed, tiled interior looks unchanged since the 18th century — because it nearly is.",tip:"Book ahead (a day or two, online) and ask for a table in the cellar — 'la cueva' is the oldest part."}},
{id:"san-gines",cat:"food",lat:40.4166,lng:-3.7067,wiki:"Chocolatería San Ginés",wl:"en",
 sr:{title:"Čokolaterija San Hines",story:"Od 1894. ovde se služi jedno jedino jelo: churros con chocolate — prženo testo koje umačeš u gustu vruću čokoladu. I to je dovoljno za svetsku slavu. Otvoreno 24 sata: u zoru se ovde sretnu oni koji izlaze iz klubova i oni koji idu na posao, i svi jedu isto. Zeleni interijer sa mermernim stolovima i fotografijama slavnih gostiju nepromenjen je generacijama. Ovo nije dezert — Madriđani ovo jedu za doručak ili u 5 ujutru, i tako treba i ti.",tip:"Posle izlaska, u 4–5 ujutru — to je pravi San Hines doživljaj. Porcija ide 6 churrosa, čokolada se pije kad umočiš poslednji."},
 en:{title:"Chocolatería San Ginés",story:"Since 1894 this place has served exactly one dish: churros con chocolate — fried dough you dip into thick hot chocolate. And that's been enough for world fame. Open 24 hours: at dawn, clubbers heading home and workers heading out meet here, all eating the same thing. The green interior with marble tables and photos of famous guests hasn't changed in generations. This is not dessert — Madrileños eat it for breakfast or at 5am, and so should you.",tip:"After a night out, at 4–5am — that's the true San Ginés experience. An order is 6 churros; you drink the chocolate once the last one's dipped."}},
{id:"casa-lucio",cat:"food",lat:40.4122,lng:-3.7094,wiki:null,wl:"en",
 sr:{title:"Casa Lucio",story:"Institucija na Cava Baji od 1974. i dom najslavnijih 'huevos rotos' na svetu: pržena jaja razbijena preko pomfrita, po želji sa iberijskim pršutom. Zvuči banalno — dok ne probaš. Lucio Blaskez je počeo kao dvanaestogodišnji konobar u ovoj istoj taverni, kupio je i pretvorio u mesto gde su za istim stolovima sedeli kraljevi, Obama, Penelopa Kruz i pola sveta. Uprkos svemu tome, ostalo je kastiljanska taverna: pločice, drvo, pršut o gredi i konobari u belom.",tip:"Rezerviši telefonom/online nekoliko dana unapred. Naruči huevos estrellados sa jamónom i bocu Riohe — ne komplikuj."},
 en:{title:"Casa Lucio",story:"An institution on Cava Baja since 1974 and home of the world's most famous 'huevos rotos': fried eggs broken over chips, with Ibérico ham if you're wise. Sounds banal — until you try it. Lucio Blázquez started as a twelve-year-old waiter in this very tavern, then bought it and turned it into a place where kings, Obama, Penélope Cruz and half the world have shared tables. Despite all that, it has remained a Castilian tavern: tiles, wood, hams hanging from beams and waiters in white jackets.",tip:"Book by phone/online several days ahead. Order huevos estrellados with jamón and a bottle of Rioja — don't overthink it."}},
{id:"san-anton",cat:"food",lat:40.4218,lng:-3.6987,wiki:"Mercado de San Antón",wl:"en",
 sr:{title:"Mercado de San Anton",story:"Moderna trospratna pijaca u srcu Čueke — odgovor kvarta na San Migel, ali sa više lokalaca a manje turista. Prizemlje je prava pijaca (voće, riba, meso), sprat je red tapas-tezgi gde biraš od japanske do galicijske kuhinje, a na krovu je terasa-restoran sa barom. Koncept 'kupiš dole, spreme ti gore' i dalje živi. Savršena stanica pre izlaska po Čueki ili pauza od šoping ulica oko Fuenkarala.",tip:"Krovna terasa u suton, radnim danom — vikendom se čeka mesto."},
 en:{title:"Mercado de San Antón",story:"A modern three-storey market in the heart of Chueca — the neighborhood's answer to San Miguel, but with more locals and fewer tourists. The ground floor is a real market (fruit, fish, meat), the first floor is a row of tapas counters running from Japanese to Galician, and the roof holds a terrace restaurant and bar. The 'buy downstairs, they cook it upstairs' concept is alive and well. A perfect staging post before a night out in Chueca or a break from the shopping streets around Fuencarral.",tip:"The rooftop at dusk on a weekday — at weekends you'll wait for a table."}},
{id:"casa-labra",cat:"food",lat:40.4174,lng:-3.7048,wiki:null,wl:"en",
 sr:{title:"Casa Labra",story:"Taverna iz 1860. dva koraka od Sola, čuvena po dve stvari: tapas od bakalara i istoriji. Ovde je 1879, u zadnjoj sobi, tajno osnovana Španska socijalistička partija (PSOE) — koja i danas postoji. A bakalar: prženi komadi (tajada de bacalao) i kroketi koji se poručuju na komad, jedu se stojeći uz čašu piva ili vermuta. Red ispred vrata je stalan, ali ide brzo — naručuješ na kasi, jedeš za visokim stolom, i za deset minuta si dalje. Tako se u Madridu ruča između dva muzeja.",tip:"Poruči 2 tajade + 2 kroketa + caña (malo pivo) — klasika. Keš ubrzava red."},
 en:{title:"Casa Labra",story:"A tavern from 1860 two steps from Sol, famous for two things: cod tapas and history. In 1879, in the back room, the Spanish Socialist Party (PSOE) — still going today — was secretly founded here. As for the cod: fried battered pieces (tajada de bacalao) and croquettes ordered by the piece, eaten standing with a small beer or vermouth. The queue outside is constant but moves fast — you order at the till, eat at a high table, and in ten minutes you're on your way. That's how Madrid lunches between two museums.",tip:"Order 2 tajadas + 2 croquettes + a caña (small beer) — the classic. Cash speeds up the queue."}},
{id:"casa-abuelo",cat:"food",lat:40.4152,lng:-3.7014,wiki:null,wl:"en",
 sr:{title:"La Casa del Abuelo",story:"'Dedina kuća', od 1906. Jedno jelo ih je proslavilo: gambas al ajillo — škampi u ključalom maslinovom ulju sa belim lukom i ljutom papričicom, servirani u glinenoj posudi koja još vri kad stigne na sto. Uz to ide njihovo slatkasto crno vino iz sopstvene vinarije, koje se pije iz malih čaša. Hleb je obavezan — umakanje u to ulje je poenta cele stvari. Malo mesta, uvek puno, stoji se — ali škampi stižu za tri minuta.",tip:"Porcija gambasa + čaša njihovog vina El Abuelo + puno hleba. Ne sedaj — pravi doživljaj je za šankom."},
 en:{title:"La Casa del Abuelo",story:"'Grandfather's House', since 1906. One dish made them famous: gambas al ajillo — shrimp in boiling olive oil with garlic and chilli, served in a clay dish still bubbling when it lands on your table. It's paired with their sweetish red wine from their own winery, drunk from small glasses. Bread is mandatory — mopping up that oil is the entire point. Tiny place, always packed, standing room — but the shrimp arrive in three minutes.",tip:"One order of gambas + a glass of their El Abuelo wine + plenty of bread. Don't sit — the real experience is at the bar."}},
{id:"la-bola",cat:"food",lat:40.4203,lng:-3.7107,wiki:null,wl:"en",
 sr:{title:"Taberna La Bola",story:"Crvena fasada blizu Kraljevske palate i hram jednog jela: cocido madrileño — madridskog kuvanog jela u tri hoda. Prvo supa sa rezancima, pa leblebija sa povrćem, pa meso: govedina, kokoš, slanina, čorizo... La Bola ga od 1870. sprema na jedini pravi način: svaka porcija u sopstvenom glinenom loncu, satima na ćumuru. Vode ga četiri generacije iste porodice. Ovo je zimski ručak posle kog se ne večera — ali u Madrid si došao i zbog ovoga.",tip:"Cocido se služi samo za ručak. Rezerviši, dođi gladan, i ostavi bar dva sata."},
 en:{title:"Taberna La Bola",story:"A red storefront near the Royal Palace and the temple of a single dish: cocido madrileño — Madrid's chickpea stew served in three acts. First the noodle soup, then chickpeas with vegetables, then the meats: beef, chicken, pork belly, chorizo... La Bola has made it the only proper way since 1870: each portion in its own clay pot, simmered for hours over charcoal. Four generations of the same family run it. This is a winter lunch after which dinner is cancelled — but this is part of why you came to Madrid.",tip:"Cocido is lunch-only. Book, arrive hungry, and allow at least two hours."}},
{id:"ardosa",cat:"drink",lat:40.4229,lng:-3.7009,wiki:null,wl:"en",
 sr:{title:"Bodega de la Ardosa",story:"Jedna od najlepših starih kafana Madrida, u Malasanji od 1892: tamno drvo, flaše do plafona, bure umesto stola. Dve stvari su svete: vermut iz slavine (na česmi, kako se ovde kaže) i tortilla de patatas — krompir-omlet koji mnogi smatraju najboljim u gradu, kremast iznutra. Ispod šanka postoji prolaz u zadnju sobu — provlačenje ispod pulta je deo folklora. Ovde dolaze svi: studenti, penzioneri, kuvari posle smene.",tip:"Subota u podne: vermut + parče tortilje + boquerones (inćuni u sirćetu). To je madridski aperitivo."},
 en:{title:"Bodega de la Ardosa",story:"One of Madrid's most beautiful old taverns, in Malasaña since 1892: dark wood, bottles to the ceiling, barrels for tables. Two things are sacred: vermouth on tap ('de grifo', as they say here) and the tortilla de patatas — a potato omelette many consider the city's best, creamy in the middle. There's a passage under the bar into the back room — ducking beneath the counter is part of the folklore. Everyone comes: students, pensioners, chefs after their shift.",tip:"Saturday noon: vermouth + a slice of tortilla + boquerones (vinegar-cured anchovies). That's the Madrid aperitivo."}},
{id:"circulo",cat:"drink",lat:40.4183,lng:-3.6963,wiki:"Círculo de Bellas Artes",wl:"en",
 sr:{title:"Círculo de Bellas Artes (krovna terasa)",story:"Kulturni centar iz 1926. sa najboljim krovom u gradu. Za par evra liftom na 7. sprat — i Madrid ti je pod nogama: Gran Vía sa Metropolisom, Cibeles, planine u daljini. Gore je bar sa ležaljkama i koktelima; dole, u zgradi, izložbe, bioskop i kafe u stilu bečkih kafeana sa ogromnim lusterima, gde uz kafu možeš sedeti satima. Statua boginje Minerve na krovu je jedan od simbola grada.",tip:"Dođi 45 min pre zalaska sunca, radnim danom. Karta za krov se kupuje dole na ulazu."},
 en:{title:"Círculo de Bellas Artes (rooftop)",story:"A cultural center from 1926 with the best rooftop in town. A few euros and a lift to the 7th floor — and Madrid lies at your feet: Gran Vía with the Metropolis building, Cibeles, mountains in the distance. Up top there's a bar with loungers and cocktails; downstairs, exhibitions, a cinema and a Viennese-style café with enormous chandeliers where you can sit over one coffee for hours. The statue of Minerva on the roof is one of the city's symbols.",tip:"Arrive 45 minutes before sunset, on a weekday. Rooftop tickets are sold at the entrance downstairs."}},
{id:"anden0",cat:"landmark",lat:40.4325,lng:-3.7005,wiki:"Chamberí (Madrid Metro)",wl:"en",
 sr:{title:"Andén 0 — stanica duhova Čamberi",story:"Metro stanica zamrznuta u 1966. Čamberi je bila jedna od prvih osam stanica madridskog metroa (1919), ali kad su vozovi produženi, njen zakrivljeni peron nije mogao da se proširi — pa je jednostavno zatvorena i zaboravljena. Pola veka je stajala netaknuta u mraku, dok su vozovi prolazili kroz nju bez zaustavljanja. Danas je muzej: originalne keramičke reklame iz dvadesetih, stare oznake, drvene blagajne. Vozovi linije 1 i dalje protutnje kroz stanicu — to je najjeziviji i najlepši trenutak posete.",tip:"Ulaz je besplatan, ali termini se rezervišu online. Stani uz peron kad voz prolazi."},
 en:{title:"Andén 0 — Chamberí Ghost Station",story:"A metro station frozen in 1966. Chamberí was one of the first eight stations of the Madrid Metro (1919), but when trains were lengthened, its curved platform couldn't be extended — so it was simply closed and forgotten. For half a century it stood untouched in the dark while trains passed through without stopping. Today it's a museum: original ceramic advertisements from the twenties, old signage, wooden ticket booths. Line 1 trains still thunder through — the eeriest and most beautiful moment of the visit.",tip:"Entry is free but time slots must be booked online. Stand by the platform as a train passes."}},
{id:"campana",cat:"food",lat:40.4148,lng:-3.7078,wiki:null,wl:"en",
 sr:{title:"La Campana (bocadillo de calamares)",story:"Madrid je grad bez mora — a njegov najčuveniji street food je sendvič sa prženim lignjama. Niko ne zna tačno zašto, ali svaki Madriđanin zna gde: u uličicama oko Plaza Mayor, a La Campana u Calle Botoneras je među favoritima već decenijama. Hrskave lignje u mekom hlebu, malo limuna ako tražiš, i to je sve — 4-5 evra i jedeš u hodu ili na trgu. Uvek je red, uvek se brzo pomera, i uvek vredi.",tip:"Naruči 'un bocadillo de calamares' i pojedi ga na Plaza Mayor — jeftinije i bolje nego u bilo kom lokalu na samom trgu."},
 en:{title:"La Campana (bocadillo de calamares)",story:"Madrid is a city without a sea — yet its most famous street food is a fried squid sandwich. Nobody knows exactly why, but every Madrileño knows where: in the lanes around Plaza Mayor, and La Campana on Calle Botoneras has been among the favorites for decades. Crispy squid rings in a soft roll, a squeeze of lemon if you ask, and that's it — 4-5 euros, eaten walking or on the square. There's always a queue, it always moves fast, and it's always worth it.",tip:"Order 'un bocadillo de calamares' and eat it on Plaza Mayor — cheaper and better than any café on the square itself."}}
];

const PLACES5 = [
{id:"belem-tower",cat:"landmark",city:"lisbon",lat:38.6916,lng:-9.2160,wiki:"Belém Tower",wl:"en",
 sr:{title:"Kula Belem (Torre de Belém)",story:"Simbol Lisabona i doba velikih otkrića: utvrđena kula iz 1519. koja je čuvala ulaz u luku odakle su Vasko da Gama i ostali isplovljavali ka Indiji i Brazilu. Manuelinski stil — kameni konopci, morski čvorovi, kupole kao od šećera — postoji praktično samo u Portugalu, i nigde nije lepši nego ovde. Nekad je stajala usred reke; zemljotres 1755. je pomerio korito pa je danas uz samu obalu.",tip:"Red za ulaz ume da bude sat vremena — spolja je lepša nego iznutra, slikaj je u zalazak i preskoči red."},
 en:{title:"Belém Tower",story:"The symbol of Lisbon and the Age of Discoveries: a fortified tower from 1519 that guarded the harbor from which Vasco da Gama and others sailed for India and Brazil. The Manueline style — stone ropes, maritime knots, sugar-like cupolas — exists practically only in Portugal, and nowhere finer than here. It once stood mid-river; the 1755 earthquake shifted the riverbed, so today it sits by the bank.",tip:"The entry queue can hit an hour — it's finer outside than in; shoot it at sunset and skip the line."}},
{id:"jeronimos",cat:"landmark",city:"lisbon",lat:38.6979,lng:-9.2066,wiki:"Jerónimos Monastery",wl:"en",
 sr:{title:"Manastir Jeronimos",story:"Najveličanstvenija građevina Portugala, plaćena — bukvalno — biberom: porez na začine iz Indije finansirao je sto godina gradnje. Podignut na mestu kapele u kojoj je Vasko da Gama proveo noć pred polazak 1497; danas njegov grob stoji odmah uz ulaz u crkvu, preko puta groba pesnika Kamoinša. Klaustar je vrhunac manuelinskog stila — dvorište gde je svaki stub isklesan drugačije, kao kamena čipka.",tip:"Crkva je besplatna (i u njoj su grobovi) — karta i red su za klaustar. Dođi pre 10h ili kupi online."},
 en:{title:"Jerónimos Monastery",story:"Portugal's most magnificent building, paid for — literally — with pepper: the tax on Indian spices funded a century of construction. Built where Vasco da Gama spent the night in a chapel before sailing in 1497; his tomb now stands just inside the church, across from the poet Camões. The cloister is the peak of the Manueline style — a courtyard where every column is carved differently, like stone lace.",tip:"The church is free (and holds the tombs) — the ticket and the queue are for the cloister. Come before 10am or buy online."}},
{id:"pasteis-belem",cat:"food",city:"lisbon",lat:38.6975,lng:-9.2033,wiki:"Pastéis de Belém",wl:"en",
 sr:{title:"Pastéis de Belém",story:"Ovde je 1837. rođen pastel de nata — i recept se od tada čuva u tajnoj sobi, znaju ga samo trojica. Monasi iz susednog Jeronimosa koristili su žumanca preostala od štirkanja odežde i prodali recept kad je manastir zatvoren. Razlika od svih ostalih nata u gradu: korica puca kao staklo, fil je topao. Prodaju preko 20.000 kolača dnevno i dalje po istom postupku.",tip:"Red ispred je za poneti — uđi unutra, sala ima 400 mesta i seda se skoro odmah. Pospi cimetom, jedi toplo."},
 en:{title:"Pastéis de Belém",story:"The pastel de nata was born here in 1837 — and the recipe has been kept in a secret room ever since, known to only three people. Monks from neighboring Jerónimos used yolks left over from starching robes, and sold the recipe when the monastery closed. What sets these apart from every other nata in town: the crust cracks like glass and the filling is warm. They sell over 20,000 a day, still made the same way.",tip:"The queue outside is for takeaway — go inside; the hall seats 400 and you're seated almost at once. Dust with cinnamon, eat warm."}},
{id:"alfama",cat:"quarter",city:"lisbon",lat:38.7117,lng:-9.1290,wiki:"Alfama",wl:"en",
 sr:{title:"Alfama (kvart)",story:"Najstariji kvart Lisabona i jedini koji je preživeo veliki zemljotres 1755. — mavarski lavirint uličica u koje se sunce jedva probija, veš na konopcima, sardine na roštilju i fado koji uveče dopire iza vrata. Ovde se ne ide po spisku znamenitosti: cilj je izgubiti se. Svaka ulica se ionako na kraju popne do vidikovca ili spusti do reke. Fado — pesma čežnje (saudade) — rođen je baš u ovim ulicama.",tip:"Uveče potraži malu fado kuću bez programa za turiste — gde meštani ćute dok se peva, tu si na pravom mestu."},
 en:{title:"Alfama (quarter)",story:"Lisbon's oldest quarter and the only one to survive the great 1755 earthquake — a Moorish maze of lanes the sun barely reaches, laundry on lines, sardines on the grill and fado drifting from behind doors at night. You don't come here with a checklist: the goal is to get lost. Every street eventually climbs to a viewpoint or drops to the river anyway. Fado — the song of longing (saudade) — was born in these very streets.",tip:"At night find a small fado house without a tourist program — where locals fall silent during the singing, you're in the right place."}},
{id:"sao-jorge",cat:"landmark",city:"lisbon",lat:38.7139,lng:-9.1335,wiki:"São Jorge Castle",wl:"en",
 sr:{title:"Zamak Svetog Đorđa (São Jorge)",story:"Tvrđava na najvišem bregu grada, sa koje se Lisabon prostire kao amfiteatar do reke Težo. Mavri su je držali do 1147, kada ju je posle četvoromesečne opsade uzeo prvi portugalski kralj Afonso Enrikeš — uz pomoć krstaša koji su usput svratili. Po bedemima šetaju paunovi, a pogled sa zidina je najbolji uvod u geografiju grada: odavde razumeš zašto Lisabon zovu gradom na sedam brda.",tip:"Kupi kartu online i dođi do 9h ili posle 17h — u podne su i red i sunce nemilosrdni."},
 en:{title:"São Jorge Castle",story:"The fortress on the city's highest hill, from which Lisbon spreads like an amphitheater down to the Tagus. The Moors held it until 1147, when Portugal's first king Afonso Henriques took it after a four-month siege — helped by crusaders who happened to stop by. Peacocks stroll the ramparts, and the view from the walls is the best introduction to the city's geography: from here you understand why Lisbon is called the city of seven hills.",tip:"Buy the ticket online and come by 9am or after 5pm — at noon both the queue and the sun are merciless."}},
{id:"tram28",cat:"landmark",city:"lisbon",lat:38.7159,lng:-9.1361,wiki:"Trams in Lisbon",wl:"en",
 sr:{title:"Tramvaj 28",story:"Žuti drveni tramvaj iz tridesetih koji se i danas penje uz brda kroz najuže ulice grada — linija 28 je slučajno postala najbolja turistička tura Lisabona: Alfama, katedrala, Baixa, Chiado i Estrela za cenu obične karte. Škripa točkova u krivinama kod Alfame je zvuk grada. Vozi se ceo krug (oko 50 min) i gleda kroz otvoren prozor kako zgrade promiču na pola metra.",tip:"Ulazi na početnoj stanici Martim Moniz pre 9h da uhvatiš mesto do prozora — i drži torbu napred, džeparoši vole ovu liniju."},
 en:{title:"Tram 28",story:"A yellow wooden tram from the 1930s that still climbs the hills through the city's narrowest streets — line 28 accidentally became Lisbon's best tourist tour: Alfama, the cathedral, Baixa, Chiado and Estrela for the price of a regular ticket. The screech of wheels in the Alfama bends is the sound of the city. Ride the full loop (about 50 min) and watch buildings pass half a meter from the open window.",tip:"Board at the Martim Moniz terminus before 9am to get a window seat — and keep your bag in front; pickpockets love this line."}},
{id:"comercio",cat:"landmark",city:"lisbon",lat:38.7075,lng:-9.1364,wiki:"Praça do Comércio",wl:"en",
 sr:{title:"Praça do Comércio (Trg trgovine)",story:"Veličanstveni trg otvoren ka reci — nekada dvorište kraljevske palate, dok je nije progutao zemljotres, cunami i požar 1. novembra 1755, katastrofa koja je promenila evropsku filozofiju (Volter je o njoj pisao u 'Kandidu'). Markiz od Pombala obnovio je ceo donji grad za par decenija po prvom antiseizmičkom urbanističkom planu u Evropi. Kroz trijumfalnu kapiju Rua Augusta uđeš pravo u srce grada.",tip:"Popni se na kapiju Rua Augusta (jeftinije i praznije od svih vidikovaca) i siđi na kej Cais das Colunas na zalazak."},
 en:{title:"Praça do Comércio",story:"A magnificent square open to the river — once the courtyard of the royal palace, until it was swallowed by the earthquake, tsunami and fire of November 1st, 1755, a catastrophe that changed European philosophy (Voltaire wrote of it in 'Candide'). The Marquis of Pombal rebuilt the entire lower town within decades on Europe's first anti-seismic urban plan. Through the Rua Augusta triumphal arch you walk straight into the city's heart.",tip:"Climb the Rua Augusta Arch (cheaper and emptier than any viewpoint) and step down to the Cais das Colunas quay at sunset."}},
{id:"se-lisbon",cat:"landmark",city:"lisbon",lat:38.7098,lng:-9.1327,wiki:"Lisbon Cathedral",wl:"en",
 sr:{title:"Katedrala Se (Sé de Lisboa)",story:"Tvrđava-crkva iz 1147, podignuta odmah po oslobođenju od Mavara — verovatno na mestu glavne džamije, kako je tada bio običaj. Dve zvonare kao kule stražare preživele su sve zemljotrese; iznutra je romanika: gola, kamena, mračna i moćna. Tramvaj 28 protutnji tik uz fasadu — to je jedan od najfotografisanijih kadrova Lisabona.",tip:"Sačekaj tramvaj sa ćoška preko puta — žuti vagon uz kameni portal je razglednica koju svi hoće."},
 en:{title:"Lisbon Cathedral (Sé)",story:"A fortress-church from 1147, built right after the liberation from the Moors — probably on the site of the main mosque, as was the custom. Its two watchtower belfries have survived every earthquake; inside it's pure Romanesque: bare, stony, dark and mighty. Tram 28 thunders right past the facade — one of Lisbon's most photographed frames.",tip:"Wait for the tram from the corner across the street — the yellow car against the stone portal is the postcard everyone wants."}},
{id:"carmo",cat:"landmark",city:"lisbon",lat:38.7122,lng:-9.1404,wiki:"Carmo Convent",wl:"en",
 sr:{title:"Manastir Karmo (ruševina)",story:"Najsnažniji spomenik zemljotresu iz 1755: gotska crkva čiji se krov srušio na vernike okupljene na misi za Dan svih svetih — i nikada nije obnovljen. Danas goli kameni luci stoje uokvirujući nebo, najlepša 'nedovršena' katedrala Evrope. Odmah pored je gornja stanica lifta Santa Justa, pa se pogled i ruševina lepo spajaju u jednu posetu.",tip:"Na lift Santa Justa se čeka dugo i naplaćuje se — do iste platforme dođeš besplatno prečicom iza manastira."},
 en:{title:"Carmo Convent (ruin)",story:"The most powerful monument to the 1755 earthquake: a Gothic church whose roof collapsed onto worshippers gathered for All Saints' Day mass — and was never rebuilt. Today bare stone arches stand framing the sky, Europe's most beautiful 'unfinished' cathedral. The upper station of the Santa Justa lift is right next door, so the view and the ruin combine neatly into one visit.",tip:"The Santa Justa lift has long queues and a fee — you can reach the same platform free via the shortcut behind the convent."}},
{id:"bairro-alto",cat:"quarter",city:"lisbon",lat:38.7118,lng:-9.1462,wiki:"Bairro Alto",wl:"en",
 sr:{title:"Bairro Alto (kvart)",story:"Danju uspavan kvart uskih ulica i zatvorenih kapaka — a od 22h najveći ulični provod u Evropi: stotine malih barova iz kojih se pije napolju, na ulici, svi pomešani sa svima. Nema klubova ni programa; cela poenta je čaša u ruci i razgovor na kaldrmi. Fado kuće i restorani rade od ranije večeri, pa je redosled prirodan: večera, fado, pa ulica.",tip:"Ginjinja ili imperial (malo pivo) se kupi na šalteru bara i pije napolju — tako radi ceo kvart. Petak i subota posle ponoći su vrhunac."},
 en:{title:"Bairro Alto (quarter)",story:"By day a sleepy quarter of narrow streets and closed shutters — from 10pm, the biggest street party in Europe: hundreds of tiny bars whose drinks are had outside, on the street, everyone mingling with everyone. No clubs, no program; the whole point is a glass in hand and conversation on the cobbles. Fado houses and restaurants open earlier, so the sequence is natural: dinner, fado, then the street.",tip:"Buy a ginjinha or an imperial (small beer) at the bar counter and drink outside — that's how the whole quarter works. Friday and Saturday after midnight are the peak."}},
{id:"timeout-market",cat:"food",city:"lisbon",lat:38.7069,lng:-9.1460,wiki:"Time Out Market Lisboa",wl:"en",
 sr:{title:"Time Out Market (Mercado da Ribeira)",story:"Stara gradska pijaca iz 1892. u kojoj je Time Out 2014. okupio najbolje kuvare i lokale grada pod jedan krov — prvi 'kurirani food hall' na svetu, koncept kasnije kopiran svuda. Na 40+ tezgi: od šefova sa Michelin zvezdicama do najboljeg prošuta, sendviča i nata u gradu. Idealno kad društvo ne može da se dogovori šta se jede — svako uzme svoje, sto je zajednički.",tip:"Špic ručka i večere znači borbu za sto — dođi do 12:15 ili oko 17h i prvo zauzmi mesto, pa tek onda kreni po hranu."},
 en:{title:"Time Out Market (Mercado da Ribeira)",story:"The old 1892 city market where Time Out gathered the city's best chefs and eateries under one roof in 2014 — the world's first 'curated food hall', a concept since copied everywhere. Across 40+ stalls: Michelin-starred chefs, the city's best presunto, sandwiches and natas. Ideal when the group can't agree on what to eat — everyone grabs their own, the table is shared.",tip:"Lunch and dinner rush means fighting for a table — arrive by 12:15 or around 5pm, claim seats first, then go for food."}},
{id:"lx-factory",cat:"quarter",city:"lisbon",lat:38.7033,lng:-9.1786,wiki:"LX Factory",wl:"en",
 sr:{title:"LX Factory",story:"Fabrički kompleks iz 1846. ispod mosta 25. aprila, pretvoren u najkreativniji kutak Lisabona: ateljei, koncept-radnje, murali, restorani u halama i knjižara Ler Devagar sa zidom knjiga do plafona i letećim biciklom — jedna od najlepših na svetu. Nedeljom je i buvljak. Duh je berlinski, pogled na most — sanfrancisački.",tip:"Nedelja pre podne: buvljak + brunch, pa se popni na krovni bar Rio Maravilha da se slikaš sa 'Kristom' preko puta."},
 en:{title:"LX Factory",story:"An 1846 factory complex beneath the 25 de Abril bridge, turned into Lisbon's most creative corner: studios, concept stores, murals, restaurants in the old halls, and the Ler Devagar bookshop with its wall of books to the ceiling and a flying bicycle — one of the world's most beautiful. On Sundays there's a flea market too. The spirit is Berlin; the bridge view, San Francisco.",tip:"Sunday morning: flea market + brunch, then head up to the Rio Maravilha rooftop bar for a photo with the 'Cristo' across the river."}},
{id:"oceanario",cat:"museum",city:"lisbon",lat:38.7633,lng:-9.0938,wiki:"Lisbon Oceanarium",wl:"en",
 sr:{title:"Okeanarijum",story:"Jedan od najboljih akvarijuma sveta, sagrađen za EXPO '98 u modernom kvartu Parque das Nações. Centralni rezervoar od pet miliona litara gledaš sa dva nivoa: ajkule, rado, mesečeva riba i jata koja kruže kao srebrni zid. Oko njega četiri okeanska staništa — od morskih vidri do pingvina. Sa decom je ovo pun pogodak, ali i odrasli ovde zanеme.",tip:"Kupi kartu online i dođi na samo otvaranje (10h) — pre školskih grupa. Usput se provozaj žičarom duž reke."},
 en:{title:"Oceanarium",story:"One of the world's finest aquariums, built for EXPO '98 in the modern Parque das Nações district. You view the five-million-litre central tank from two levels: sharks, rays, an ocean sunfish and shoals circling like a silver wall. Around it, four ocean habitats — from sea otters to penguins. A guaranteed hit with kids, but adults go quiet here too.",tip:"Buy online and arrive right at opening (10am) — before the school groups. Ride the riverside cable car while you're there."}},
{id:"senhora-monte",cat:"park",city:"lisbon",lat:38.7196,lng:-9.1327,wiki:null,wl:"en",
 sr:{title:"Vidikovac Senhora do Monte",story:"Najviši i najlepši vidikovac Lisabona, na bregu Graça — ceo grad ti je pod nogama: zamak preko puta, crveni krovovi Mourarije, reka i most u daljini. Za razliku od poznatijeg Portas do Sol, ovde se popne manje ljudi, pa se na zidiću sedi mirno, često uz nečiju gitaru. Zalazak odavde je ritual koji lokalci ljubomorno čuvaju za sebe.",tip:"Ponesi flašu vina i dođi 40 minuta pre zalaska — bez žurbe, ovo je mesto gde se ostaje."},
 en:{title:"Senhora do Monte viewpoint",story:"Lisbon's highest and loveliest viewpoint, on the Graça hill — the whole city lies at your feet: the castle across the way, the red roofs of Mouraria, the river and bridge in the distance. Unlike the better-known Portas do Sol, fewer people make the climb, so you sit on the low wall in peace, often to someone's guitar. Sunset from here is a ritual locals jealously keep to themselves.",tip:"Bring a bottle of wine and come 40 minutes before sunset — no rush, this is a place for staying."}},
{id:"ginjinha",cat:"drink",city:"lisbon",lat:38.7143,lng:-9.1387,wiki:"Ginjinha",wl:"en",
 sr:{title:"A Ginjinha (Espinheira)",story:"Šank od dva kvadrata na trgu São Domingos koji od 1840. služi jedno jedino piće: ginjinju, liker od višanja. Naručuje se 'com' (sa višnjom u čaši) ili 'sem' (bez), popije se na trotoaru u dva gutljaja, čaša se vrati. Pet generacija iste porodice, cena oko dva evra, i verovatno najkraća a najupečatljivija degustacija u Evropi.",tip:"'Com elas' — uvek sa višnjama. I pazi: slatko je, a jako. Dve su dovoljne."},
 en:{title:"A Ginjinha (Espinheira)",story:"A two-square-meter counter on São Domingos square that has served exactly one drink since 1840: ginjinha, sour cherry liqueur. Order it 'com' (with a cherry in the glass) or 'sem' (without), drink it on the pavement in two sips, hand the glass back. Five generations of the same family, about two euros, and probably Europe's shortest yet most memorable tasting.",tip:"'Com elas' — always with the cherries. And careful: it's sweet, but strong. Two is plenty."}},
{id:"pink-street",cat:"drink",city:"lisbon",lat:38.7071,lng:-9.1440,wiki:null,wl:"en",
 sr:{title:"Pink Street (Rua Nova do Carvalho)",story:"Nekadašnja najozloglašenija ulica lučke četvrti Cais do Sodré — mornari, barovi sumnjive reputacije — 2011. je ofarbana u rozе i preporođena u epicentar noćnog Lisabona. Pod ružičastim asfaltom i kišobranima iznad glave nižu se barovi: od kultnog Pensão Amor (bivši bordel pretvoren u bar-kabare) do Musicbox kluba ispod mosta. Posle Bairro Alta, žurka silazi ovde — i traje do zore.",tip:"Pensão Amor pogledaj i ako ne piješ — enterijer je muzej za sebe. Ulica živi od ponoći."},
 en:{title:"Pink Street (Rua Nova do Carvalho)",story:"Once the most notorious street of the Cais do Sodré port district — sailors, bars of dubious repute — painted pink in 2011 and reborn as the epicenter of Lisbon nightlife. Under the pink asphalt and a canopy of umbrellas run the bars: from the cult Pensão Amor (a former brothel turned bar-cabaret) to the Musicbox club under the bridge. After Bairro Alto, the party moves down here — and runs till dawn.",tip:"See Pensão Amor even if you don't drink — the interior is a museum in itself. The street comes alive after midnight."}}
