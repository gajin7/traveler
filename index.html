<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDF8FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<title>Cicerone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%236750A4'/><text x='50' y='68' font-size='60' text-anchor='middle'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
:root{
  /* Material 3 light scheme */
  --primary:#6750A4; --on-primary:#FFFFFF;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --tertiary-container:#FFD8E4; --on-tertiary-container:#31111D;
  --surface:#FDF8FD; --surface-dim:#DED8E1;
  --sc:#F3EDF7; --sc-high:#ECE6F0; --sc-highest:#E6E0E9;
  --on-surface:#1D1B20; --on-surface-var:#49454F;
  --outline:#79747E; --outline-var:#CAC4D0;
  --inverse-surface:#322F35; --inverse-on:#F5EFF7;
  --green:#1B6B45;
  --el1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
  --el2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
  --el3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.30);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--surface);color:var(--on-surface)}
#app{height:100%;display:flex;flex-direction:column}
/* ripple */
.ripple{position:relative;overflow:hidden}
.ripple .rp{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
/* top app bar */
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);z-index:20}
header h1{font-size:20px;font-weight:500;letter-spacing:0;display:flex;align-items:center;gap:8px}
header h1 .accent{color:var(--primary);font-weight:700}
.logoic{display:flex;color:var(--primary)}
.mi{vertical-align:middle;flex-shrink:0}
.lang-btn{background:none;border:1px solid var(--outline);color:var(--primary);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
/* views */
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.view.active{display:block}
#view-map{overflow:hidden}
#map{position:absolute;inset:0}
/* M3 bottom navigation */
nav{display:flex;background:var(--sc);padding:8px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--outline-var)}
nav button{flex:1;background:none;border:none;color:var(--on-surface-var);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500;font-family:inherit}
nav button .ic{display:flex;align-items:center;justify-content:center;padding:4px 14px;border-radius:16px;transition:background .2s}
nav button.active{color:var(--on-surface);font-weight:700}
nav button.active .ic{background:var(--secondary-container)}
/* elevated center map tab */
nav button.maptab{overflow:visible !important}
nav button.maptab .ic{width:56px;height:56px;padding:0;border-radius:50%;background:var(--primary);color:#fff;margin-top:-30px;box-shadow:var(--el3);border:4px solid var(--surface)}
nav button.maptab.active{color:var(--primary)}
nav button.maptab.active .ic{background:var(--primary);color:#fff}
nav{overflow:visible;position:relative;z-index:40}
nav button{overflow:visible}
/* header info icon */
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--outline);background:none;color:var(--primary);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn.on{background:var(--primary-container);border-color:transparent}
/* M3 filter chips */
.chips{display:flex;gap:8px;padding:14px 16px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--outline-var);color:var(--on-surface-var);padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container);font-weight:600}
/* cards */
.cards{padding:12px 16px 100px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--sc);border-radius:12px;overflow:hidden;display:flex;min-height:100px;box-shadow:var(--el1);border:none}
.card:active{box-shadow:var(--el2)}
.card .thumb{width:110px;flex:0 0 110px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.card .cbody{padding:12px 16px;flex:1;min-width:0}
.card h3{font-size:15.5px;font-weight:600;margin-bottom:3px;color:var(--on-surface)}
.card .cat{font-size:11px;color:var(--primary);text-transform:uppercase;letter-spacing:.8px;font-weight:700;display:flex;align-items:center;gap:5px}
.card .dist{display:flex;align-items:center;gap:4px}
.cardrate{margin-left:auto;color:#B7791F;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:3px;letter-spacing:0}
.openb{font-size:10px;font-weight:800;padding:2.5px 7px;border-radius:9px;background:#D8F3E3;color:#1B6B45;margin-left:6px;letter-spacing:.2px}
.openb.cl{background:#FADCD9;color:#B3261E}
.card p{font-size:13px;color:var(--on-surface-var);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.card .dist{font-size:12px;color:var(--green);font-weight:700;margin-top:4px}
/* detail sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:var(--surface);overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet.open{display:block}
.hero{height:260px;background-size:cover;background-position:center;position:relative;display:flex;align-items:center;justify-content:center}
.heroic{opacity:.45}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,var(--surface) 0%,transparent 40%)}
.backbtn{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;background:rgba(255,255,255,.92);border:none;color:var(--on-surface);width:40px;height:40px;border-radius:50%;font-size:17px;z-index:2;box-shadow:var(--el1)}
.sbody{padding:0 20px 130px;margin-top:-34px;position:relative}
.sbody .cat{font-size:12px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;font-weight:700;display:flex;align-items:center;gap:6px}
.sbody h2{font-size:26px;font-weight:700;margin:6px 0 8px;line-height:1.2;letter-spacing:-.2px}
#sheetrating{min-height:22px;margin-bottom:12px;font-size:13.5px;color:var(--on-surface-var)}
#sheetrating .stars{color:#E8A13C;display:inline-flex;vertical-align:-3px}
#sheetrating .rnum{font-weight:800;color:var(--on-surface);margin:0 4px}
#sheetrating .aibadge{font-size:9.5px;vertical-align:2px}
#sheetrating .rline{display:block;margin-top:3px;font-style:italic}
.sbody .story{font-size:15.5px;line-height:1.7;color:var(--on-surface);white-space:pre-wrap}
.tipbox{margin-top:18px;background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.tipbox .mi{margin-top:2px}
.actions{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap}
.abtn{flex:1;min-width:130px;border:none;border-radius:24px;padding:14px 12px;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.abtn.primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--el1)}
.abtn.sec{background:var(--secondary-container);color:var(--on-secondary-container)}
.abtn:active{opacity:.85}
/* here view */
.herehead{padding:26px 16px 6px;text-align:center}
.herehead h2{font-size:24px;font-weight:700;letter-spacing:-.2px}
.herehead p{color:var(--on-surface-var);font-size:14px;margin-top:8px;line-height:1.5}
.bigbtn{margin:18px 16px 6px;width:calc(100% - 32px);background:var(--primary-container);border:none;color:var(--on-primary-container);font-size:17px;font-weight:700;padding:18px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--el2);font-family:inherit}
#hereic{display:flex}
#sendbtn{display:flex;align-items:center;justify-content:center}
.backbtn{display:flex;align-items:center;justify-content:center}
.bigbtn:active{box-shadow:var(--el1)}
.statusline{text-align:center;color:var(--on-surface-var);font-size:13.5px;padding:6px 16px 8px;min-height:20px}
/* map search */
#searchwrap{position:absolute;top:10px;left:12px;right:56px;z-index:30}
#searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:28px;padding:4px 8px 4px 14px;box-shadow:var(--el2)}
#searchbox input{flex:1;border:none;background:none;outline:none;font-size:14.5px;font-family:inherit;color:var(--on-surface);padding:9px 0;min-width:0}
#searchic{display:flex;color:var(--on-surface-var)}
#searchclear{background:none;border:none;color:var(--on-surface-var);font-size:15px;padding:8px;display:none}
#searchresults{background:var(--surface);border-radius:16px;margin-top:6px;box-shadow:var(--el2);overflow:hidden;display:none;max-height:280px;overflow-y:auto}
#searchresults.on{display:block}
.sr-item{padding:12px 16px;border-bottom:1px solid var(--sc-high);font-size:14px}
.sr-item:last-child{border-bottom:none}
.sr-item b{display:block;font-weight:600}
.sr-item span{color:var(--on-surface-var);font-size:12.5px}
#foundcard{position:absolute;left:12px;right:12px;bottom:16px;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--el3);display:none;z-index:30}
#foundcard.on{display:block}
#foundcard h4{font-size:15.5px;font-weight:700}
#foundcard p{color:var(--on-surface-var);font-size:12.5px;margin:3px 0 10px}
#foundcard .row{display:flex;gap:8px;flex-wrap:wrap}
#foundcard .abtn{padding:11px 10px;font-size:13px;min-width:0}
/* plan menu (bottom sheet) */
#planmenu{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:none;align-items:flex-end}
#planmenu.on{display:flex}
#planmenuin{background:var(--surface);border-radius:24px 24px 0 0;width:100%;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:70%;overflow-y:auto}
#planmenuin h3{font-size:17px;font-weight:700;margin-bottom:12px}
.pm-item{display:flex;align-items:center;gap:12px;width:100%;background:var(--sc);border:none;border-radius:14px;padding:14px 16px;font-size:14.5px;font-weight:600;font-family:inherit;color:var(--on-surface);margin-bottom:8px;text-align:left}
.pm-item span{color:var(--on-surface-var);font-weight:400;font-size:12.5px;margin-left:auto}
.pm-new{display:flex;gap:8px;margin-top:4px}
.pm-new input{flex:1;background:var(--surface);border:1px solid var(--outline-var);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;font-family:inherit;min-width:0}
.pm-new select{flex:1;background:var(--surface);border:1px solid var(--outline-var);border-radius:12px;padding:12px 10px;font-size:14px;outline:none;font-family:inherit;min-width:0;color:var(--on-surface)}
.georesults{background:var(--surface);border:1px solid var(--outline-var);border-radius:12px;margin-top:4px;display:none;max-height:170px;overflow-y:auto}
/* onboarding */
#onboard{position:fixed;inset:0;background:var(--surface);z-index:100;display:none;overflow-y:auto}
#onboard.on{display:block}
.ob-in{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 28px 40px;display:flex;flex-direction:column;min-height:100%}
.ob-logo{width:72px;height:72px;border-radius:22px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:var(--el2)}
#onboard h2{font-size:28px;font-weight:800;letter-spacing:-.3px}
#onboard>div>p{color:var(--on-surface-var);font-size:15px;margin:8px 0 22px;line-height:1.5}
.ob-feats{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.ob-feat{display:flex;gap:14px;align-items:flex-start}
.ob-feat .ic{width:40px;height:40px;border-radius:12px;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ob-feat b{font-size:14.5px;display:block}
.ob-feat span{font-size:13px;color:var(--on-surface-var);line-height:1.45}
.ob-langs{display:flex;gap:10px;margin-bottom:14px}
.ob-lang{flex:1 1 30%;background:var(--surface);border:1.5px solid var(--outline-var);border-radius:14px;padding:12px 6px;font-size:13.5px;font-weight:600;font-family:inherit;color:var(--on-surface)}
.ob-lang.on{border-color:var(--primary);background:var(--primary-container);color:var(--on-primary-container)}
.pm-txt{background:var(--sc);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:var(--on-surface);margin-bottom:10px;white-space:pre-wrap}
.pm-disc{color:var(--on-surface-var);font-size:12px;margin:2px 4px 10px}
/* Put (trip) view */
#planview{padding:16px 16px 110px}
#planview h2{font-size:20px;font-weight:800;margin:14px 0 10px;display:flex;align-items:center;gap:8px}
.planbig{background:var(--sc);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.pb-head{display:flex;align-items:center;gap:10px}
.pb-head h4{font-size:16px;font-weight:800;flex:1}
.pb-head span{color:var(--on-surface-var);font-size:12px}
.pb-head button{background:none;border:none;color:var(--on-surface-var);padding:6px}
.stoprow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sc-highest)}
.stoprow:last-of-type{border-bottom:none}
.stoprow .n{width:24px;height:24px;border-radius:50%;background:var(--secondary-container);color:var(--on-secondary-container);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.stoprow .st{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stoprow .sx{background:none;border:none;color:var(--on-surface-var);padding:4px 6px}
.emptybox{background:var(--sc);border-radius:16px;padding:18px;margin-bottom:14px}
.emptybox b{font-size:15px;display:block;margin-bottom:6px}
.emptybox p{color:var(--on-surface-var);font-size:13.5px;line-height:1.55}
.tourbanner{background:var(--primary-container);color:var(--on-primary-container);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.tourbanner .tt{flex:1;min-width:0}
.tourbanner b{font-size:14.5px;display:block}
.tourbanner span{font-size:12.5px;opacity:.85}
.tourbanner button{border:none;border-radius:12px;padding:9px 12px;font-weight:700;font-size:12.5px;font-family:inherit}
.plancard{background:var(--sc);border-radius:14px;padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:10px}
.plancard .pc-txt{flex:1;min-width:0}
.plancard h4{font-size:14.5px;font-weight:700}
.plancard span{color:var(--on-surface-var);font-size:12px}
.plancard button{border:none;border-radius:12px;padding:9px 12px;font-weight:700;font-size:12.5px;font-family:inherit;display:flex;align-items:center;gap:4px}
.pc-start{background:var(--primary);color:#fff}
.pc-del{background:none;color:var(--on-surface-var)}
/* tour */
#tourctl{padding:4px 16px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tourctl .abtn{flex:none;padding:10px 18px;font-size:13.5px}
.card.selmode{cursor:pointer}
.card.selected{outline:3px solid var(--primary);outline-offset:-3px}
.card .selbadge{position:absolute;margin:8px;background:var(--primary);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;box-shadow:var(--el1)}
.card{position:relative}
#tourbar{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));background:var(--inverse-surface);color:var(--inverse-on);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:70;box-shadow:var(--el3)}
#tourbar.on{display:flex}
.tb-info{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.tb-num{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.tb-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-dist{font-size:12px;opacity:.8}
.tb-btn{background:rgba(255,255,255,.12);border:none;color:#D0BCFF;border-radius:12px;padding:9px 12px;font-weight:700;font-size:12.5px;font-family:inherit;display:flex;align-items:center;gap:4px}
.tb-btn.tb-end{color:#FFB4AB}
.numbadge{background:var(--primary);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:var(--el1)}
.numbadge.done{background:#1B6B45}
/* AI suggestions */
.suggblock{margin:10px 16px 0;background:var(--sc);border-radius:16px;padding:16px}
.suggblock h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.suggblock p{color:var(--on-surface-var);font-size:13px;margin-top:4px;line-height:1.5}
.suggblock input{width:100%;background:var(--surface);border:1px solid var(--outline-var);border-radius:12px;color:var(--on-surface);padding:12px 14px;font-size:14px;outline:none;margin-top:8px;font-family:inherit}
.suggblock input:focus{border-color:var(--primary)}
.aibadge{display:inline-flex;align-items:center;gap:4px;background:var(--primary-container);color:var(--on-primary-container);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.4px}
.savebtn{background:var(--secondary-container);color:var(--on-secondary-container);border:none;border-radius:16px;padding:7px 14px;font-size:12.5px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:5px;margin-top:6px}
/* chat */
#view-chat{display:none;flex-direction:column}
#view-chat.active{display:flex}
#chattop{display:flex;justify-content:flex-end;padding:8px 14px 0}
#chatclear{background:none;border:1px solid var(--outline-var);color:var(--on-surface-var);border-radius:16px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
#chatlog{flex:1;overflow-y:auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--sc-high);color:var(--on-surface);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:none;color:var(--on-surface-var);font-size:12.5px;text-align:center}
#chatbar{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--surface)}
#chatinput{flex:1;background:var(--sc-high);border:none;border-radius:28px;color:var(--on-surface);padding:13px 18px;font-size:15px;outline:none;font-family:inherit}
#chatinput::placeholder{color:var(--on-surface-var)}
#sendbtn{background:var(--primary);border:none;width:48px;height:48px;border-radius:50%;font-size:18px;color:var(--on-primary);box-shadow:var(--el1)}
.cbtn{background:var(--sc-high);border:none;width:44px;height:44px;border-radius:50%;color:var(--on-surface-var);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbtn.rec{background:#B3261E;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}50%{box-shadow:0 0 0 10px rgba(179,38,30,0)}}
.msg img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}
/* info */
.infobox{padding:18px 16px 120px}
.infobox h2{font-size:19px;font-weight:600;margin:18px 0 8px}
.infobox p{color:var(--on-surface-var);font-size:14px;line-height:1.6;margin-bottom:8px}
.infobox input{width:100%;background:var(--surface);border:1px solid var(--outline);border-radius:12px;color:var(--on-surface);padding:14px 16px;font-size:14px;outline:none;margin:6px 0;font-family:inherit}
.infobox input:focus{border:2px solid var(--primary);padding:13px 15px}
.infobox .abtn{width:100%;margin-top:8px}
.pill{display:inline-block;background:var(--secondary-container);color:var(--on-secondary-container);padding:5px 12px;border-radius:14px;font-size:12px;margin:2px 4px 2px 0;font-weight:600}
/* snackbar (speaking) */
#speakbar{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));background:var(--inverse-surface);color:var(--inverse-on);border:none;border-radius:8px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:var(--el3)}
#speakbar.on{display:flex}
#updbar{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 64px);background:var(--primary);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:120;box-shadow:var(--el3)}
#updbar.on{display:flex}
#updbar .t{flex:1;font-size:13.5px;font-weight:600}
#updbar button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;font-family:inherit}
#citybar{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 64px);background:var(--inverse-surface);color:var(--inverse-on);border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:10px;z-index:115;box-shadow:var(--el3)}
#citybar.on{display:flex}
#citybar .t{flex:1;font-size:13.5px;font-weight:600}
#citybar button{background:var(--primary);border:none;color:#fff;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;font-family:inherit;display:flex;align-items:center}
#speakbar .t{flex:1;font-size:13.5px}
#speakbar button{background:none;border:none;color:#D0BCFF;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13.5px;font-family:inherit}
.maplibregl-ctrl-attrib{font-size:9px}
.marker{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:var(--el2)}
.marker span{transform:rotate(45deg);display:flex;color:#fff}
#speakbar .t{flex:1;font-size:13.5px;display:flex;align-items:center;gap:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--on-surface-var);animation:ty 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes ty{0%,60%,100%{opacity:.3}30%{opacity:1}}
/* ============ dark theme — auto (system) unless user forces light/dark ============ */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#D0BCFF; --on-primary:#381E72;
    --primary-container:#4F378B; --on-primary-container:#EADDFF;
    --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
    --tertiary-container:#633B48; --on-tertiary-container:#FFD8E4;
    --surface:#141218; --surface-dim:#141218;
    --sc:#1D1B20; --sc-high:#211F26; --sc-highest:#2B2930;
    --on-surface:#E6E0E9; --on-surface-var:#CAC4D0;
    --outline:#938F99; --outline-var:#49454F;
    --inverse-surface:#E6E0E9; --inverse-on:#322F35;
    --green:#6CD9A2;
  }
  :root:not([data-theme="light"]) .backbtn{background:rgba(30,27,34,.85);color:#fff}
  :root:not([data-theme="light"]) .openb{background:#12362a;color:#6CD9A2}
  :root:not([data-theme="light"]) .openb.cl{background:#4a1f1c;color:#F2B8B5}
  :root:not([data-theme="light"]) .cardrate{color:#E8C26B}

  :root:not([data-theme="light"]) .tb-num{color:#381E72}
  :root:not([data-theme="light"]) #citybar button{color:#381E72}
}
:root[data-theme="dark"]{
  --primary:#D0BCFF; --on-primary:#381E72;
  --primary-container:#4F378B; --on-primary-container:#EADDFF;
  --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
  --tertiary-container:#633B48; --on-tertiary-container:#FFD8E4;
  --surface:#141218; --surface-dim:#141218;
  --sc:#1D1B20; --sc-high:#211F26; --sc-highest:#2B2930;
  --on-surface:#E6E0E9; --on-surface-var:#CAC4D0;
  --outline:#938F99; --outline-var:#49454F;
  --inverse-surface:#E6E0E9; --inverse-on:#322F35;
  --green:#6CD9A2;
}
:root[data-theme="dark"] .backbtn{background:rgba(30,27,34,.85);color:#fff}
:root[data-theme="dark"] .openb{background:#12362a;color:#6CD9A2}
:root[data-theme="dark"] .openb.cl{background:#4a1f1c;color:#F2B8B5}
:root[data-theme="dark"] .cardrate{color:#E8C26B}
:root[data-theme="dark"] #speakbar button{color:#4F378B}
:root[data-theme="dark"] .tb-num{color:#381E72}
:root[data-theme="dark"] #citybar button{color:#381E72}
</style>
