/* ---- Madrid: porodični restorani iz plana ---- */
{id:"gustos",cat:"food",city:"madrid",lat:40.4152,lng:-3.7067,wiki:null,wl:"en",
 sr:{title:"Gustos Madrid (Plaza Mayor)",story:"Restoran na samoj Plaza Mayor (broj 8) — praktičan izbor kad si sa porodicom u srcu starog centra: španska kuhinja, paelja, tapasi i deo stolova pod arkadama trga. Cene su oko 20–30 € po osobi, radi do kasno uveče. Nije skriveni lokalni dragulj — to na samom trgu i ne postoji — ali je pouzdan, prostran i savršeno se uklapa u večernju rutu San Miguel → Plaza Mayor → Sol.",tip:"Traži sto oko 18:30 — pre španskog večernjeg špica, idealno sa decom. Sto uz zid arkada ima najviše mesta za kolica."},
 en:{title:"Gustos Madrid (Plaza Mayor)",story:"A restaurant right on Plaza Mayor (No. 8) — a practical pick when you're with family in the heart of the old center: Spanish cooking, paella, tapas and some tables under the square's arcades. Around €20–30 per person, open late. It's not a hidden local gem — those don't exist on the square itself — but it's reliable, spacious, and fits perfectly into the evening route of San Miguel → Plaza Mayor → Sol.",tip:"Ask for a table around 6:30pm — before the Spanish dinner rush, ideal with kids. Tables along the arcade wall have the most room for a stroller."}},
{id:"arrabal",cat:"food",city:"madrid",lat:40.4158,lng:-3.7079,wiki:null,wl:"en",
 sr:{title:"Arrabal Madrid (Plaza Mayor)",story:"Opuštenija i povoljnija opcija na Plaza Mayor 23: oko 10–30 € po osobi, dugo radno vreme i fleksibilnost koja znači kad putuješ sa bebom — ne moraš da pogodiš rezervaciju u tačan minut. Sendviči, tapasi, kombinovani tanjiri, brza usluga. Kad porodica treba da jede odmah, a ne za sat vremena, ovo je to mesto.",tip:"Dobra alternativa ako je Gustos pun — ista lokacija, niža cena, bez čekanja."},
 en:{title:"Arrabal Madrid (Plaza Mayor)",story:"The more relaxed, cheaper option at Plaza Mayor 23: around €10–30 per person, long opening hours and the kind of flexibility that matters when traveling with a baby — no need to hit a reservation to the minute. Sandwiches, tapas, combo plates, fast service. When the family needs to eat now rather than in an hour, this is the place.",tip:"A good fallback if Gustos is full — same location, lower price, no waiting."}},
{id:"oven-mozzarella",cat:"food",city:"madrid",lat:40.4143,lng:-3.6987,wiki:null,wl:"en",
 sr:{title:"Oven Mozzarella (kod Prada)",story:"Jednostavna italijanska hrana dva koraka od Prada (Calle del Prado 25) — pica, pasta, salate, oko 20–30 € po osobi. Zašto je u ovom vodiču: posle sat i po muzeja sa decom, svima treba nešto poznato i brzo, a ne gastronomska avantura. Klimatizovano, prostrano, deca uvek nađu nešto što vole. Idealna stanica između Prada i večernje šetnje.",tip:"Ručaj ranije (pre 13h) i izbegao si i gužvu i špansko kasno vreme ručka."},
 en:{title:"Oven Mozzarella (near the Prado)",story:"Simple Italian food two steps from the Prado (Calle del Prado 25) — pizza, pasta, salads, around €20–30 per person. Why it's in this guide: after an hour and a half of museum with kids, everyone needs something familiar and fast, not a gastronomic adventure. Air-conditioned, spacious, kids always find something they like. The ideal stop between the Prado and an evening stroll.",tip:"Have lunch early (before 1pm) and you dodge both the crowds and Spain's late lunch hour."}},
{id:"roost-chicken",cat:"food",city:"madrid",lat:40.4092,lng:-3.6932,wiki:null,wl:"en",
 sr:{title:"Roost Chicken (Atocha)",story:"Brza, neformalna i povoljna opcija blizu Atoche (Paseo del Prado 46): pečena piletina sa prilozima, oko 10–20 € po osobi. Ovo je mesto za dan kad su deca već umorna, kad se jede efikasno i kreće dalje — ili za klopu pre voza sa obližnje stanice. Bez ceremonije, brzo i sito.",tip:"Zgodan i za poneti — uzmi piletinu i jedi u Botaničkoj bašti ili Retiru, oba su blizu."},
 en:{title:"Roost Chicken (Atocha)",story:"Fast, informal and affordable near Atocha (Paseo del Prado 46): roast chicken with sides, around €10–20 per person. This is the spot for the day the kids are already tired, when eating needs to be efficient — or for a meal before a train from the nearby station. No ceremony, quick and filling.",tip:"Great for takeaway too — grab a chicken and eat in the Botanical Garden or Retiro, both close by."}},
/* ---- Alicante ---- */
{id:"postiguet",cat:"park",city:"alicante",lat:38.3453,lng:-0.4764,wiki:"Playa del Postiguet",wl:"en",
 sr:{title:"Plaža Postiguet",story:"Gradska plaža Alikantea, tačno ispod tvrđave Santa Barbara — zlatni pesak, mirno i plitko more i šetalište sa palmama odmah iza leđa. Zato je savršena za 'Alikante u jednom danu': sa železničke stanice si ovde za deset minuta, bez ikakvog transfera van grada. Ujutru je more najmirnije a sunce još milosrdno; tuševi, ležaljke i kafići su tu uz plažu. Iznad tebe ceo dan bdi Benakantil — stena od 166 m sa tvrđavom na vrhu, zaštitni znak grada.",tip:"Dođi pre 10h: pesak još nije vreo, ima mesta u prvom redu i more je providno kao staklo. Beba u dubok hlad ispod suncobrana."},
 en:{title:"Postiguet Beach",story:"Alicante's city beach, directly beneath Santa Bárbara castle — golden sand, calm shallow water and a palm-lined promenade right behind you. That's what makes it perfect for 'Alicante in one day': you're here ten minutes from the railway station, with no transfer out of town. In the morning the sea is calmest and the sun still merciful; showers, loungers and cafés line the beach. Above you all day looms the Benacantil — a 166 m rock with the castle on top, the city's trademark.",tip:"Come before 10am: the sand isn't scorching yet, front-row spots are free and the water is glass-clear. Keep the baby in deep shade under an umbrella."}},
{id:"santa-barbara",cat:"landmark",city:"alicante",lat:38.3487,lng:-0.4781,wiki:"Santa Bárbara Castle",wl:"en",
 sr:{title:"Tvrđava Santa Barbara",story:"Jedna od najvećih srednjovekovnih tvrđava Mediterana, na steni Benakantil 166 metara iznad mora. Osnovali su je Mavari u 9. veku; ime je dobila po Svetoj Varvari jer je hrišćanska vojska osvojila baš na njen dan 1248. Pogled sa vrha je razlog dolaska: ceo Alikante, luka i more do horizonta. Najlepši trik: u steni ispod tvrđave je lift (ulaz preko puta plaže Postiguet, oko 2,70 €) koji te podigne pravo gore — nema penjanja po vrućini. Po steni potraži 'Mavarsko lice' (La Cara del Moro) — profil urezan prirodom u kamen, vidljiv sa plaže.",tip:"Leti idi kasno popodne (16:30–17h) — sunce niže, svetlo za slike savršeno. Lift gore, pešaka nizbrdo kroz park Ereta u stari grad."},
 en:{title:"Santa Bárbara Castle",story:"One of the largest medieval fortresses on the Mediterranean, on the Benacantil rock 166 meters above the sea. Founded by the Moors in the 9th century; it got its name because the Christian army captured it on Saint Barbara's day in 1248. The view from the top is the reason to come: all of Alicante, the harbor and the sea to the horizon. The best trick: inside the rock below the castle there's a lift (entrance across from Postiguet beach, about €2.70) that takes you straight up — no climbing in the heat. Look for the 'Moor's Face' (La Cara del Moro) — a profile carved by nature into the rock, visible from the beach.",tip:"In summer go late afternoon (4:30–5pm) — lower sun, perfect light for photos. Lift up, walk down through Ereta Park into the old town."}},
{id:"explanada",cat:"landmark",city:"alicante",lat:38.3444,lng:-0.4815,wiki:"Explanada de España",wl:"en",
 sr:{title:"Explanada de Espanja",story:"Ikona Alikantea: šetalište uz marinu popločano sa 6,6 miliona mermernih kockica u crveno-krem-crnim talasima koji kao da se ljuljaju pod nogama. Sa obe strane četiri reda palmi, u sredini kiosci, sladoledžije i štandovi. Ovo je mesto večernjeg rituala 'paseo' — kad ceo grad izađe da prošeta, od babe do bebe. Talasasti mozaik je jedan od najfotografisanijih motiva na Kosta Blanki.",tip:"Sladoled uzmi na Explanadi, ali večeru traži ulicu-dve dublje u stari grad — uz samu marinu je duplo skuplje."},
 en:{title:"Explanada de España",story:"Alicante's icon: a marina-side promenade paved with 6.6 million marble tiles in red-cream-black waves that seem to roll under your feet. Four rows of palms on either side, kiosks, ice-cream stands and stalls down the middle. This is the site of the evening 'paseo' ritual — when the whole city comes out to stroll, from grandmothers to babies. The wave mosaic is one of the most photographed motifs on the Costa Blanca.",tip:"Get ice cream on the Explanada, but look for dinner a street or two deeper into the old town — right on the marina it's twice the price."}},
{id:"casco-antiguo",cat:"quarter",city:"alicante",lat:38.3479,lng:-0.4794,wiki:null,wl:"en",
 sr:{title:"Stari grad (El Barrio / Santa Cruz)",story:"Odmah iza gradske većnice počinje najstariji deo Alikantea: kvart Santa Cruz — uske strme uličice, bele kućice sa plavim vratima, saksije bugenvilije na svakom zidu i stepeništa koja se penju uz padinu Benakantila. Ovo je slika 'bele Španije' kakvu očekuješ na jugu, deset minuta od plaže. Uveče se donji deo (El Barrio) pretvara u zonu tapas-barova i izlaska. Sa vrha kvarta, kod kapelice Ermita de Santa Cruz, pogled na krovove i more.",tip:"Penji se predveče kad padne vrućina — a sa decom stani kod prve fontane: uličice su strme, ne mora se do vrha da bi bilo lepo."},
 en:{title:"Old Town (El Barrio / Santa Cruz)",story:"Right behind the town hall begins Alicante's oldest quarter: Santa Cruz — narrow steep lanes, white houses with blue doors, bougainvillea pots on every wall and stairways climbing the slope of the Benacantil. This is the 'white Spain' picture you expect in the south, ten minutes from the beach. In the evening the lower part (El Barrio) turns into the tapas-and-nightlife zone. From the top of the quarter, by the little Ermita de Santa Cruz chapel, a view over rooftops and sea.",tip:"Climb in the early evening once the heat breaks — and with kids, stop at the first fountain: the lanes are steep, and you don't need to reach the top for it to be lovely."}},
{id:"mercado-central-ali",cat:"food",city:"alicante",lat:38.3479,lng:-0.4854,wiki:"Mercado Central de Alicante",wl:"es",
 sr:{title:"Centralna pijaca Alikantea",story:"Modernistička hala iz 1921. i stomak grada: dole riba i morski plodovi izloženi kao nakit, gore voće, povrće, pršut i sirevi. Ovde se vidi šta Kosta Blanka zaista jede. Uzmi breskve, trešnje i hladnu horčatu za plažu — sve je duplo jeftinije i bolje nego u marketu. Pijaca radi pre podne (do ~14:30), pa se uklapa u jutarnji deo dana.",tip:"Tezge sa 'turrón' nugatom — Alikante je svetska prestonica turona, ponesi kući."},
 en:{title:"Alicante Central Market",story:"A modernist hall from 1921 and the city's stomach: fish and seafood displayed like jewelry downstairs, fruit, vegetables, ham and cheeses upstairs. This is where you see what the Costa Blanca really eats. Grab peaches, cherries and a cold horchata for the beach — everything is half the price and twice as good as the supermarket. The market runs mornings (until ~2:30pm), so it fits the early part of the day.",tip:"Find the turrón nougat stalls — Alicante is the world capital of turrón; take some home."}},
{id:"la-crispeta",cat:"food",city:"alicante",lat:38.3453,lng:-0.4800,wiki:null,wl:"en",
 sr:{title:"La Crispeta",story:"Porodična taverna u starom gradu (Calle Jorge Juan 6), na minut od Explanade i većnice. Mediteranska kuhinja, riba, pirinči i tapasi bez turističke pompe. U tvom planu je označena kao ručak posle plaže — i to je tačno njena uloga: klimatizovana duga pauza u najgorem delu vrućine, ponedeljkom radi 11:30–16:00 i uveče od 19:15.",tip:"Posle ručka si na dva minuta od početka uspona u Santa Cruz kvart — savršen redosled."},
 en:{title:"La Crispeta",story:"A family tavern in the old town (Calle Jorge Juan 6), a minute from the Explanada and the town hall. Mediterranean cooking, fish, rice dishes and tapas without the tourist circus. In your plan it's marked as the after-beach lunch — and that's exactly its role: a long air-conditioned pause through the worst of the heat; on Mondays it runs 11:30–16:00 and evenings from 19:15.",tip:"After lunch you're two minutes from the start of the climb into the Santa Cruz quarter — the perfect sequence."}},
{id:"mediterraneum",cat:"food",city:"alicante",lat:38.3460,lng:-0.4757,wiki:null,wl:"en",
 sr:{title:"Mediterraneum (uz Postiguet)",story:"Restoran na šetalištu Paseo de Gomiz, bukvalno preko puta plaže Postiguet — logistički najlakša opcija celog dana: sa peškira do stola za dva minuta, sa kolicima bez ijedne stepenice. Mediteranska kuhinja i pirinči sa pogledom na more. Kad je cilj da se niko ne pomera daleko, ovo je to.",tip:"Rezerviši sto u hladu terase za 13h — tada je plaža najvrelija, a sto uz ogradu ima najbolji pogled."},
 en:{title:"Mediterraneum (by Postiguet)",story:"A restaurant on the Paseo de Gomiz promenade, literally across from Postiguet beach — the logistically easiest option of the whole day: towel to table in two minutes, stroller-friendly with not a single step. Mediterranean cooking and rice dishes with a sea view. When the goal is that nobody moves far, this is it.",tip:"Book a shaded terrace table for 1pm — that's when the beach is hottest, and the tables by the railing have the best view."}},
{id:"taberna-gourmet",cat:"drink",city:"alicante",lat:38.3446,lng:-0.4809,wiki:null,wl:"en",
 sr:{title:"La Taberna del Gourmet",story:"Najozbiljnija gastronomska adresa u ovom vodiču za Alikante (Calle San Fernando 10, uz Explanadu): nagrađivana taverna sa vrhunskim tapasima, morskim plodovima sa obližnje pijace i ozbiljnom vinskom kartom. Za kasni ručak ili raniju večeru pre voza — završni gastronomski akcenat dana na moru.",tip:"Poruči selekciju tapasa umesto glavnih jela — kroz 5-6 malih tanjira prođeš celu regiju."},
 en:{title:"La Taberna del Gourmet",story:"The most serious gastronomic address in this Alicante guide (Calle San Fernando 10, by the Explanada): an award-winning tavern with top-tier tapas, seafood from the nearby market and a serious wine list. For a late lunch or early dinner before the train — the closing gastronomic note of a day at the sea.",tip:"Order a selection of tapas instead of mains — 5-6 small plates take you through the whole region."}}
];

/* ============ images via Wikipedia REST (loaded by the phone, cached in-page) ============ */
const imgCache = {};
async function placeImage(p){
  if(imgCache[p.id]!==undefined) return imgCache[p.id];
  let url = null;
  /* 1) Wikipedia article image (curated places) */
  if(p.wiki){
    try{
      const r = await fetch(`https://${p.wl||"en"}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(p.wiki)}`);
      if(r.ok){
        const j = await r.json();
        if(j.thumbnail && j.thumbnail.source) url = j.thumbnail.source; // original thumb URL — no size rewriting (rewrites can 404)
      }
    }catch(e){}
  }
  /* 2) fallback for AI places: a real photo taken at these coordinates (Wikimedia Commons geosearch) */
  if(!url && isFinite(+p.lat) && isFinite(+p.lng)){
    try{
      const r = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${p.lat}%7C${p.lng}&ggsradius=150&ggslimit=1&ggsnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=640&format=json&origin=*`);
      if(r.ok){
        const j = await r.json();
        const pages = j.query && j.query.pages ? Object.values(j.query.pages) : [];
        const ii = pages[0] && pages[0].imageinfo && pages[0].imageinfo[0];
        if(ii && (ii.thumburl||ii.url)) url = ii.thumburl || ii.url;
      }
    }catch(e){}
  }
  imgCache[p.id] = url;
  return url;
}
function applyThumb(el,p){
  if(!el) return;
  el.style.background = `linear-gradient(135deg,${CAT_COLOR[p.cat]}44,${CAT_COLOR[p.cat]}22)`;
  el.style.color = CAT_COLOR[p.cat];
  el.innerHTML = ic(CAT_ICON[p.cat],36);
  placeImage(p).then(u=>{
    if(!u) return;
    /* preload first — only swap in if the image actually loads (otherwise the icon stays) */
    const im = new Image();
    im.onload = ()=>{ if(!el.isConnected && !document.getElementById(el.id)) return;
      const target = document.getElementById(el.id) || el;
      target.innerHTML=""; target.style.backgroundImage=`url('${u}')`; target.style.backgroundSize="cover"; target.style.backgroundPosition="center"; };
    im.onerror = ()=>{ imgCache[p.id]=null; };
    im.src = u;
  });
}

async function ensureCityHours(){
  if(hoursBusy) return;
  const key=store.get("tv_key"); if(!key) return;
  const missing=cityPlaces().filter(p=>!HOURS[p.id]);
  if(!missing.length) return;
  hoursBusy=true;
  try{
    const listTxt=missing.map((p,i)=>`${i}|${p.en.title} (${p.cat})`).join("\n");
    const arr=await anthropicJSON(
      `You estimate TYPICAL opening hours of places in ${cityFull(city)}. For EACH input line return one object in a JSON array: {"i":number,"known":boolean,"o":"HH:MM" (typical opening),"c":"HH:MM" (typical closing; may be past midnight like "02:00"),"closed":[array of weekday numbers 0=Sunday..6=Saturday when CLOSED all day, usually empty]}. Streets, squares, quarters, parks and viewpoints that are always accessible → known:true,"o":"00:00","c":"23:59",closed:[]. known=true only if you genuinely know the typical schedule; unsure → known:false. NEVER invent precise schedules you don't know. ONLY the JSON array.`,
      `Places:\n${listTxt}`, 3500);
    (arr||[]).forEach(x=>{
      const p=missing[+x.i]; if(!p) return;
      HOURS[p.id]={known:!!x.known, o:String(x.o||"00:00"), c:String(x.c||"23:59"), closed:Array.isArray(x.closed)?x.closed.map(Number):[]};
    });
    missing.forEach(p=>{ if(!HOURS[p.id]) HOURS[p.id]={known:false,o:"",c:"",closed:[]}; });
    store.set("tv_hours", JSON.stringify(HOURS));
    renderCards();
  }catch(e){}

function openNow(p){
  const h=HOURS[p.id]; if(!h||!h.known) return null;
  const d=new Date();
  if(h.closed.includes(d.getDay())) return false;
  const toMin=s=>{const m=String(s).split(":");return (+m[0])*60+(+m[1]||0)};
  const n=d.getHours()*60+d.getMinutes(), o=toMin(h.o), c=toMin(h.c);
  return c>=o ? (n>=o&&n<=c) : (n>=o||n<=c); // overnight (e.g. bar till 02:00)
}

function fmtDist(m){ return m<1000 ? Math.round(m)+" "+t("m") : (m/1000).toFixed(1)+" "+t("km"); }
function haversine(a,b,c,d){
  const R=6371000,p=Math.PI/180,dl=(c-a)*p,dg=(d-b)*p;
  const h=Math.sin(dl/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ============ anti-hallucination: every AI-invented place must be verified against OpenStreetMap ============
   A place survives only if the geocoder finds it near the city (≤20 km from center) — and then we use the
   geocoder's REAL coordinates, not the AI's. Unverifiable places are dropped. */
async function verifyPlaces(list, center, radiusM){
  const R = radiusM || 20000;
  const out = [];
  await Promise.all(list.map(async p=>{
    if(!p || !p.name) return;
    try{
      const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(p.name)}&lat=${center[1]}&lon=${center[0]}&limit=4`);
      const j = await r.json();
      const hit = (j.features||[]).find(f=>{
        const [lng,lat] = f.geometry.coordinates;
        return haversine(center[1],center[0],lat,lng) <= R;
      });
      if(!hit) return; // not found near this city → dropped (this kills "Zeleni venac in Subotica" type errors)
      const [lng,lat] = hit.geometry.coordinates;
      p.lat = lat; p.lng = lng; // snap to real OSM coordinates
      out.push(p);
    }catch(e){
      // geocoder unreachable → fall back to a sanity check on the AI's own coords
      if(isFinite(+p.lat) && isFinite(+p.lng) && haversine(center[1],center[0],+p.lat,+p.lng) <= R) out.push(p);
    }
  }));
  return out;
}
const STRICT = `CRITICAL ANTI-HALLUCINATION RULE: include ONLY places you are CERTAIN really exist in this exact city. Never include places from other cities, never invent names, never guess. Fewer correct places are ALWAYS better than more invented ones. Every place will be verified against a map database and invented ones will be discarded.`;

async function anthropicJSON(system, user, maxTok){
  const key = store.get("tv_key");
  if(!key) throw new Error("nokey");
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body:JSON.stringify({ model: store.get("tv_model")||"claude-haiku-4-5", max_tokens:maxTok||2000, system, messages:[{role:"user",content:user}] })
  });
  if(!r.ok) throw new Error((await r.text()).slice(0,200));
  const j = await r.json();
  let txt = j.content.filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  txt = txt.replace(/^```(json)?/,"").replace(/```$/,"").trim();
  const fb = txt.indexOf("["), ob = txt.indexOf("{");
  let raw;
  if(ob!==-1 && (fb===-1 || ob<fb)){ // outermost structure is an object → wrap into an array
    const oe=txt.lastIndexOf("}");
    if(oe<=ob) throw new Error("no json");
    raw="["+txt.slice(ob,oe+1)+"]";
  } else {
    const end=txt.lastIndexOf("]");
    if(fb===-1||end<=fb) throw new Error("no json");
    raw=txt.slice(fb,end+1);
  }
  try{ return JSON.parse(raw); }
  catch(e){
    /* repair common model glitches: trailing commas, smart quotes */
    raw = raw.replace(/,\s*([\]}])/g,"$1").replace(/[\u201C\u201D]/g,'\\"').replace(/[\u2018\u2019]/g,"'");
    return JSON.parse(raw);
  }
}

async function doSearch(q){
  const c=CITIES[city].center;
  try{
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${c[1]}&lon=${c[0]}&lang=en`);
    const j=await r.json();
    const res=(j.features||[]).filter(f=>f.geometry&&f.geometry.coordinates);
    const box=$("searchresults");
    if(!res.length){ box.innerHTML=`<div class="sr-item"><span>${t("searchNoRes")}</span></div>`; box.classList.add("on"); return; }
    box.innerHTML=res.map((f,i)=>{
      const p=f.properties||{};
      const sub=[p.street,p.district,p.city||p.county].filter(Boolean).join(", ");
      return `<div class="sr-item" onclick="pickResult(${i})"><b>${esc(p.name||q)}</b><span>${esc(sub)}</span></div>`;
    }).join("");
    box.classList.add("on");
    window._searchRes=res;
  }catch(e){ /* offline — ignore */ }
}
function pickResult(i){
  const f=window._searchRes[i]; if(!f) return;
  const p=f.properties||{}, [lng,lat]=f.geometry.coordinates;
  $("searchresults").classList.remove("on");
  foundPlace={name:p.name||$("searchinput").value.trim(), sub:[p.street,p.city||p.county].filter(Boolean).join(", "), lat, lng, osm:p.osm_value||""};
  if(searchMarker) searchMarker.remove();
  if(map){
    const el=document.createElement("div");
    el.className="marker"; el.style.background="#B3261E";
    el.innerHTML=`<span>${ic("search",15)}</span>`;
    searchMarker=new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([lng,lat]).addTo(map);
    map.flyTo({center:[lng,lat],zoom:16});
  }
  $("foundcard").innerHTML=`<h4>${esc(foundPlace.name)}</h4><p>${esc(foundPlace.sub)}</p>
    <div class="row">
      <button class="abtn primary ripple" onclick="enrichFound(this)">${ic("magic",16)} ${t("aiInfo")}</button>
      <button class="abtn sec ripple" onclick="foundToPlace().then(p=>openPlanMenu(p.id))">${ic("event",16)} ${t("addToPlan")}</button>
      <button class="abtn sec ripple" onclick="clearSearch()">✕</button>
    </div>`;
  $("foundcard").classList.add("on");
}
function clearSearch(){
  $("searchinput").value=""; $("searchclear").style.display="none";
  $("searchresults").classList.remove("on"); $("foundcard").classList.remove("on");
  if(searchMarker){ searchMarker.remove(); searchMarker=null; }
  foundPlace=null;
}
/* turn the found search result into a full AI place (with or without an AI story) */
let foundCache={};
async function foundToPlace(withAI, btn){
  const key = foundPlace.lat+","+foundPlace.lng;
  if(foundCache[key]) return foundCache[key];
  let cat="landmark", story=foundPlace.sub||foundPlace.name, tip="";
  if(withAI){
    try{
      const arr = await anthropicJSON(
        `You are a local expert for ${cityFull(city)}. Respond ONLY with a JSON array containing exactly one object: {"cat": one of "landmark"|"museum"|"park"|"quarter"|"food"|"drink", "story": string (70-100 words, vivid tour-guide story in ${LANG_NAME[lang]} about this exact place), "tip": string (one practical tip, same language)}.`,
        `Place: "${foundPlace.name}" (${foundPlace.sub}), OSM type: ${foundPlace.osm}, coordinates ${foundPlace.lat},${foundPlace.lng} in ${CITIES[city].name}.`, 800);
      const o=arr[0]||{};
      cat=CAT_ICON[o.cat]?o.cat:"landmark"; story=String(o.story||story); tip=String(o.tip||"");
    }catch(e){ if(btn) btn.innerHTML=ic("magic",16)+" "+t("suggErr"); }
  }
  const lb={title:foundPlace.name, story, tip};
  const place={ id:"ai-find-"+Date.now(), ai:true, city, cat, lat:foundPlace.lat, lng:foundPlace.lng, wiki:null, sr:lb, en:lb };
  foundCache[key]=place;
  SUGG.push(place);
  return place;
}

  btn.innerHTML=`<span class="spin"></span> ${t("aiInfoLoad")}`;

function locateCity(){
  cityStatus(t("locating2"), true);
  if(!navigator.geolocation){ cityStatus(t("locFail")); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
    let best=null,bd=Infinity;
    Object.keys(CITIES).forEach(k=>{
      const d=haversine(userPos.lat,userPos.lng,CITIES[k].center[1],CITIES[k].center[0]);
      if(d<bd){bd=d;best=k;}
    });
    if(best && bd<60000){ closePlanMenu(); setCity(best,true); return; }
    /* not on the list — try to name where the user is and offer to add it */
    try{
      const r=await fetch(`https://photon.komoot.io/reverse?lat=${userPos.lat}&lon=${userPos.lng}&lang=en`);
      const j=await r.json();
      const p=((j.features||[])[0]||{}).properties||{};
      const name=p.city||p.town||p.name||"";
      if(name){ $("newcityname").value=name; cityStatus(`„${name}” ${t("notOnList")}`); return; }
    }catch(e){}
    cityStatus(t("locFail"));
  }, ()=>cityStatus(t("locFail")), {timeout:8000, maximumAge:120000});
}

async function addCity(){
  const raw=($("newcityname").value||"").trim();
  /* guards */
  if(!store.get("tv_key")){ cityStatus(t("cityNeedKey")); return; }
  if(raw.length<2 || raw.length>40 || !/^[\p{L}][\p{L}\s\-'.]*$/u.test(raw)){ cityStatus(t("cityBad")); return; }
  if(Object.keys(CUSTOM_CITIES).length>=10){ cityStatus(t("cityLimit")); return; }
  const key="c-"+raw.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  if(CITIES[key] || Object.values(CITIES).some(c=>c.name.toLowerCase()===raw.toLowerCase())){ closePlanMenu(); setCity(Object.keys(CITIES).find(k=>CITIES[k].name.toLowerCase()===raw.toLowerCase())||key, true); return; }
  /* 1) geocoder check — does this city actually exist? */
  cityStatus(t("cityCheck"), true);
  let geo=null;
  try{
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(raw)}&limit=5&lang=en`);
    const j=await r.json();
    geo=(j.features||[]).find(f=>["city","town","village","municipality"].includes((f.properties||{}).osm_value) || ["city","town"].includes((f.properties||{}).type));
  }catch(e){ /* geocoder unreachable — AI check still applies */ }
  /* 2) AI validation + content generation (single call) */
  cityStatus(`${t("cityGen")}: ${raw}… ${t("cityGenNote")}`, true);
  try{
    const arr = await anthropicJSON(
      `You are building a city guide. ${STRICT} STRICT RULES: if the input is not a real, existing city/town suitable for a tourist guide, or it is offensive, fictional, a joke, a person's name, or nonsense — return [{"ok":false}]. Never invent a city. Otherwise respond ONLY with a JSON array containing exactly one object:
[{"ok":true,"city":{"name":string (proper local name),"country":string,"lat":number,"lng":number},"places":[10-12 objects: {"name":string,"cat":"landmark"|"museum"|"park"|"quarter"|"food"|"drink","lat":number,"lng":number,"story":string (60-90 words, vivid tour-guide story in ${LANG_NAME[lang]}),"tip":string (one practical local tip, same language)}] }]
Mix categories: top sights, one or two quarters, real well-known food/drink spots. Use your best knowledge of real coordinates.`,
      `Input city name: "${raw}"${geo?` (geocoder match: ${geo.properties.name}, ${geo.properties.country}, coords ${geo.geometry.coordinates[1]},${geo.geometry.coordinates[0]})`:""}`, 7000);
    const o=arr[0]||{};
    if(!o.ok || !o.city || !Array.isArray(o.places) || o.places.length<5){ cityStatus(t("cityBad")); return; }
    /* 3) cross-check: if geocoder found the city, its coords win; big mismatch with no geocoder match → reject */
    let center=[+o.city.lng, +o.city.lat];
    if(geo){
      const [glng,glat]=geo.geometry.coordinates;
      if(haversine(glat,glng,+o.city.lat,+o.city.lng) > 150000){ center=[glng,glat]; } else { center=[glng,glat]; }
    } else if(!isFinite(center[0])||!isFinite(center[1])){ cityStatus(t("cityBad")); return; }
    const verified = await verifyPlaces(o.places.filter(x=>x&&x.name), center);
    if(verified.length<4){ cityStatus(t("cityBad")); return; }
    const places=verified.filter(x=>x&&x.name&&isFinite(+x.lat)&&isFinite(+x.lng)).map((x,i)=>{
      const lb={title:String(x.name), story:String(x.story||""), tip:String(x.tip||"")};
      return { id:key+"-"+i, ai:true, city:key, cat:(CAT_ICON[x.cat]?x.cat:"landmark"), lat:+x.lat, lng:+x.lng, wiki:null, sr:lb, en:lb };
    });
    CUSTOM_CITIES[key]={name:String(o.city.name||raw), country:String(o.city.country||""), center, zoom:13, custom:true};
    CITIES=Object.assign({}, BUILT_CITIES, EURO_CITIES, CUSTOM_CITIES);
    CITY_PLACES[key]=places;
    store.set("tv_cities", JSON.stringify(CUSTOM_CITIES));
    store.set("tv_cityplaces", JSON.stringify(CITY_PLACES));
    closePlanMenu();
    setCity(key, true);
    toast(t("cityAdded")+" · "+CITIES[key].name);
  }catch(e){ cityStatus(t("suggErr")); }
}
function deleteCity(k){
  if(!CUSTOM_CITIES[k]) return;
  if(!confirm(t("cityDelQ"))) return;
  delete CUSTOM_CITIES[k]; delete CITY_PLACES[k];
  CITIES=Object.assign({}, BUILT_CITIES, EURO_CITIES, CUSTOM_CITIES);
  PLANS=PLANS.filter(p=>p.city!==k); savePlans();
  store.set("tv_cities", JSON.stringify(CUSTOM_CITIES));
  store.set("tv_cityplaces", JSON.stringify(CITY_PLACES));
  if(city===k) setCity("madrid", true); else openCityMenu();
}

/* ============ SHARED ACCESS (encrypted key + unlock code) ============ */
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveAes(code, salt){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, km,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function makeShareLink(){
  const key = store.get("tv_key");
  const code = ($("sharecode").value||"").trim();
  const st = $("sharestatus");
  if(!key){ st.textContent = t("needKeyFirst"); return; }
  if(code.length<4){ st.textContent = t("codeShort"); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const aes = await deriveAes(code, salt);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, aes, new TextEncoder().encode(key));
  const blob = b64e(salt)+"."+b64e(iv)+"."+b64e(ct);
  const url = location.origin + location.pathname + "#k=" + encodeURIComponent(blob);
  if(navigator.share){ try{ await navigator.share({title:"Cicerone", url}); st.textContent=t("linkReady"); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); st.textContent=t("linkReady"); }
  catch(e){ st.textContent = url; }
}
function checkSharedLink(){
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if(m){
    store.set("tv_locked", decodeURIComponent(m[1]));
    history.replaceState(null,"",location.pathname+location.search);
  }
  const pm = location.hash.match(/[#&]pl=([^&]+)/);
  if(pm){
    history.replaceState(null,"",location.pathname+location.search);
    setTimeout(()=>importSharedPlan(decodeURIComponent(pm[1])), 600);
  }
  if(store.get("tv_locked") && !store.get("tv_key")) openUnlockMenu();
}
function openUnlockMenu(msg){
  openMenu(`<h3>${ic("ticket",18)} ${t("unlockT")}</h3>
    <div class="pm-txt">${t("unlockS")}</div>
    ${msg?`<p class="pm-disc" style="color:#B3261E">${esc(msg)}</p>`:""}
    <div class="pm-new"><input id="unlockcode" placeholder="${t("codePh")}" autocomplete="off"><button class="abtn primary" onclick="tryUnlock()">${t("unlockB")}</button></div>
    <button class="pm-item" style="margin-top:10px;justify-content:center" onclick="closePlanMenu()">${t("tourCancel")}</button>`);
}
async function tryUnlock(){
  const code=($("unlockcode").value||"").trim();
  const blob=store.get("tv_locked"); if(!blob||!code) return;
  try{
    const [s,i,c]=blob.split(".");
    const aes=await deriveAes(code, b64d(s));
    const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(i)}, aes, b64d(c));
    store.set("tv_key", new TextDecoder().decode(pt));
    closePlanMenu(); renderInfo(); toast(t("unlocked"));
  }catch(e){ openUnlockMenu(t("wrongCode")); }
}

/* ============ UPDATE CHECK (cache-busting new-version detection) ============ */
async function checkUpdate(manual){
  if(!/^https?:/.test(location.protocol)) { if(manual) toast(t("updLatest")); return; }
  try{
    const r = await fetch(location.pathname + "?vchk=" + Date.now(), {cache:"no-store"});
    const txt = await r.text();
    const m = txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] !== APP_VERSION && m[1] !== "2026.08.18-1848"){
      $("updtxt").textContent = t("updAvail");
      $("updgo").textContent = t("updBtn");
      $("updbar").classList.add("on");
    } else if(manual) toast(t("updLatest"));
  }catch(e){ if(manual) toast(t("suggErr")); }
}
function applyUpdate(){
  /* query param busts every HTTP cache layer; localStorage/IndexedDB data survives */
  location.replace(location.pathname + "?u=" + Date.now());
}
setTimeout(()=>checkUpdate(false), 4000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkUpdate(false); });

const idb = {
  _db:null,
  open(){ return this._db ? Promise.resolve(this._db) : new Promise((res,rej)=>{
    const r=indexedDB.open("traveler",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("tickets",{keyPath:"id"});
    r.onsuccess=()=>{this._db=r.result;res(this._db)}; r.onerror=()=>rej(r.error);
  })},
  async put(tk){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction("tickets","readwrite"); tx.objectStore("tickets").put(tk); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })},
  async all(){ const db=await this.open(); return new Promise((res,rej)=>{ const rq=db.transaction("tickets").objectStore("tickets").getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); })},
  async del(id){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction("tickets","readwrite"); tx.objectStore("tickets").delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })}
};

/* reusable geo-autocomplete: attach to an input, results in a dropdown, pick → {name,lat,lng} */
function attachGeoSearch(inputId, boxId, onPick){
  const inp=$(inputId), box=$(boxId);
  let tm=null;
  inp.addEventListener("input",()=>{
    onPick(null);
    clearTimeout(tm);
    if(inp.value.trim().length<3){ box.style.display="none"; return; }
    tm=setTimeout(async ()=>{
      try{
        const c=CITIES[city].center;
        const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(inp.value.trim())}&lat=${c[1]}&lon=${c[0]}&limit=5`);
        const j=await r.json(); const res=(j.features||[]).filter(f=>f.geometry);
        if(!res.length){ box.style.display="none"; return; }
        box.innerHTML=res.map((f,i)=>{const p=f.properties||{};const sub=[p.street,p.city||p.county].filter(Boolean).join(", ");
          return `<div class="sr-item" data-i="${i}"><b>${esc(p.name||inp.value)}</b><span>${esc(sub)}</span></div>`;}).join("");
        box.style.display="block";
        box.querySelectorAll(".sr-item").forEach(el=>el.addEventListener("click",()=>{
          const f=res[+el.dataset.i], p=f.properties||{};
          inp.value=p.name||inp.value;
          onPick({name:inp.value, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]});
          box.style.display="none";
        }));
      }catch(e){ box.style.display="none"; }
    },400);
  });
}

async function geocodeFallback(name){
  try{
    const c=CITIES[city].center;
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(name+" "+CITIES[city].name)}&lat=${c[1]}&lon=${c[0]}&limit=3`);
    const j=await r.json();
    const f=(j.features||[]).find(f=>haversine(c[1],c[0],f.geometry.coordinates[1],f.geometry.coordinates[0])<60000);
    if(f) return {name, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]};
  }catch(e){}
  return {name, lat:null, lng:null};
}

function tripDays(){
  const out=[]; if(!TRIP) return out;
  let d=new Date(TRIP.arrive+"T12:00:00"); const end=new Date(TRIP.depart+"T12:00:00");
  let guard=0;
  while(d<=end && guard++<10){
    out.push({label:`${t("dayNames")[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`, first:out.length===0, last:+d===+end});
    d=new Date(+d+86400000);
  }
  if(out.length) out[out.length-1].last=true;
  return out;
}
async function generateTripPlans(btn){
  if(!TRIP || TRIP.city!==city) return;
  if(!store.get("tv_key")){ toast(t("cityNeedKey")); showView("info"); return; }
  const days=tripDays(); if(!days.length){ toast(t("tripDatesErr")); return; }
  if(btn) btn.innerHTML=`<span class="spin"></span> ${t("genning")}`;
  const known = cityPlaces().map(p=>`${p.id}|${p.en.title}|${p.lat.toFixed(4)},${p.lng.toFixed(4)}`).join("\n");
  const hotelTxt = TRIP.hotel ? `Hotel: "${TRIP.hotel.name}"${TRIP.hotel.lat?` at ${TRIP.hotel.lat.toFixed(4)},${TRIP.hotel.lng.toFixed(4)}`:""}.` : "No hotel given.";
  /* transfer estimate: arrival point → hotel */
  let transferMin=0;
  if(TRIP.point && TRIP.point.lat!=null && TRIP.hotel && TRIP.hotel.lat!=null)
    transferMin = Math.max(15, Math.round(haversine(TRIP.point.lat,TRIP.point.lng,TRIP.hotel.lat,TRIP.hotel.lng)/1000*2.2));
  const modeTxt = TRIP.mode==="car" ? "arriving by car directly to the hotel"
    : `arriving by ${TRIP.mode||"plane"} at "${TRIP.point?TRIP.point.name:"?"}"${transferMin?` (transfer to hotel ≈ ${transferMin} min)`:""}`;
  const depBuffer = TRIP.mode==="plane" ? "leave the hotel ~2.5-3h before the flight (incl. transfer)"
    : TRIP.mode==="car" ? "flexible departure by car" : "leave the hotel ~1-1.5h before departure (incl. transfer)";
  const trTxt = TRIP.transport==="car"||TRIP.transport==="rent"
    ? "They have a car during the stay — day clusters may be farther apart, prefer places with reasonable parking, farther highlights are OK."
    : "They use public transport and walking — keep each day a compact, walkable cluster (metro between clusters).";
  try{
    let arr = await anthropicJSON(
      `You are planning a ${days.length}-day visit to ${cityFull(city)}. ${STRICT} Respond ONLY with a JSON array of exactly ${days.length} day objects, in order: {"title": string (short theme in ${LANG_NAME[lang]}, WITHOUT the date), "stops":[4-6 objects: {"id": string (EXACT id from KNOWN PLACES — STRONGLY preferred) OR "name"+"lat"+"lng"+"cat"+"story"+"tip" for real places not on the list}]}. Rules: DAY 1 starts realistically only after arrival time + transfer + hotel check-in (fewer stops if arrival is late; if arrival is in the evening, day 1 may be just dinner nearby). LAST DAY must end in time: ${depBuffer}. ${trTxt} Group stops geographically per day, starting near the hotel when sensible; NEVER repeat a stop across days.
KNOWN PLACES (id | title | lat,lng):\n${known}`,
      `Trip: arrive ${TRIP.arrive}${TRIP.arriveTime?" at "+TRIP.arriveTime:""}, ${modeTxt}. Depart ${TRIP.depart}${TRIP.departTime?" at "+TRIP.departTime:""}${TRIP.point?` from "${TRIP.point.name}"`:""}. (${days.length} days) ${hotelTxt} Notes from the traveler: ${TRIP.notes||"none"}.`, 8000);
    if(!Array.isArray(arr)||!arr.length) throw new Error("empty");
    for(let i=0;i<days.length && i<arr.length;i++){
      const day=arr[i]; if(!day||!Array.isArray(day.stops)) continue;
      const rawNew=day.stops.filter(s=>!(s.id&&findPlace(s.id))&&s&&s.name);
      const verifiedNew=await verifyPlaces(rawNew, CITIES[city].center);
      const okNames=new Set(verifiedNew.map(v=>v.name));
      const ids=[];
      day.stops.forEach((s,j)=>{
        const ex=s.id&&findPlace(s.id);
        if(ex){ if(!ids.includes(ex.id)) ids.push(ex.id); return; }
        if(!s||!s.name||!okNames.has(s.name)) return;
        const v=verifiedNew.find(x=>x.name===s.name);
        const lb={title:String(s.name), story:String(s.story||s.name), tip:String(s.tip||"")};
        const p={ id:"ai-trip-"+Date.now()+"-"+i+"-"+j, ai:true, city, cat:(CAT_ICON[s.cat]?s.cat:"landmark"), lat:+v.lat, lng:+v.lng, wiki:null, sr:lb, en:lb };
        SAVED.push(p); ids.push(p.id);
      });
      if(ids.length) PLANS.push({id:"plan-"+Date.now()+"-"+i, name:`${days[i].label} — ${String(day.title||"")}`.trim(), city, stops:ids});
    }
    store.set("tv_saved", JSON.stringify(SAVED));
    savePlans(); renderPlanView(); renderMarkers();
    toast(t("plansMade"));
  }catch(e){ toast(t("suggErr")); renderPlanView(); }
}

const b64u = s => btoa(unescape(encodeURIComponent(s)));
const b64ud = s => decodeURIComponent(escape(atob(s)));
async function sharePlan(planId){
  const pl=PLANS.find(x=>x.id===planId); if(!pl) return;

        st:String(Lp(p).story||"").slice(0,280), ti:String(Lp(p).tip||"").slice(0,140)} : {id};
    }).filter(Boolean)};
  const url=location.origin+location.pathname+"#pl="+encodeURIComponent(b64u(JSON.stringify(payload)));
  if(navigator.share){ try{ await navigator.share({title:t("planShareTxt"), text:pl.name, url}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast(t("copied")); }catch(e){}

function importSharedPlan(b64){

  openMenu(`<h3>${ic("event",18)} ${t("planGotT")}</h3>

    <button class="pm-item" style="justify-content:center" onclick="closePlanMenu()">${t("tourCancel")}</button>`);

function acceptSharedPlan(json){
  const o=JSON.parse(json);
  let key=o.ck;
  if(!CITIES[key]){
    if(Array.isArray(o.cx)&&isFinite(+o.cx[0])){
      CUSTOM_CITIES[key]={name:String(o.cn||key), country:String(o.cc||""), center:[+o.cx[0],+o.cx[1]], zoom:13, custom:true};
      CITIES=Object.assign({}, BUILT_CITIES, EURO_CITIES, CUSTOM_CITIES);
      store.set("tv_cities", JSON.stringify(CUSTOM_CITIES));
    } else key=city;
  }
  const ids=[];
  o.s.forEach((s,i)=>{
    if(s.id && findPlace(s.id)){ ids.push(s.id); return; }
    if(!s.n||!isFinite(+s.la)) return;
    const lb={title:String(s.n), story:String(s.st||s.n), tip:String(s.ti||"")};
    const p={id:"ai-shared-"+Date.now()+"-"+i, ai:true, city:key, cat:(CAT_ICON[s.ca]?s.ca:"landmark"), lat:+s.la, lng:+s.lo, wiki:null, sr:lb, en:lb};
    CITY_PLACES[key]=(CITY_PLACES[key]||[]).concat([p]); ids.push(p.id);
  });
  store.set("tv_cityplaces", JSON.stringify(CITY_PLACES));
  if(ids.length){ PLANS.push({id:"plan-"+Date.now(), name:String(o.n), city:key, stops:ids}); savePlans(); }
  closePlanMenu(); setCity(key,true); showView("plan"); toast(t("planGotOk"));
}
function removeStop(planId, stopId){

}
function startPlan(planId){
  const pl=PLANS.find(x=>x.id===planId); if(!pl||pl.stops.length<1) return;
  const decide=()=>{
    const ordered=orderStops(pl.stops.slice(), userPos);
    const first=findPlace(ordered[0]);
    const d = (userPos&&first) ? haversine(userPos.lat,userPos.lng,first.lat,first.lng) : null;
    if(first && d!=null && d>800){
      // too far from the start — help the user get there first
      curPlace=first;
      const dest=`${first.lat},${first.lng}`;
      openMenu(`<h3>${ic("bus",18)} ${t("toStartT")}</h3>
        <div class="pm-txt">${t("firstStopIs")} <b>${esc(Lp(first).title)}</b> — ${fmtDist(d)} ${t("awayIs")}.</div>
        <button class="pm-item" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=transit','_blank')">${ic("bus",18)} ${t("transitG")}</button>
        <button class="pm-item" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking','_blank')">${ic("walk",18)} ${t("walkG")}</button>
        ${store.get("tv_key")?`<button class="pm-item" onclick="askAIRoute()">${ic("magic",18)} ${t("askRoute")}</button>`:""}
        <button class="pm-item" style="background:var(--primary-container);color:var(--on-primary-container);justify-content:center" onclick="closePlanMenu();launchTour(${JSON.stringify(ordered).replace(/"/g,"&quot;")})">${ic("play",18)} ${t("startAnyway")}</button>
        <button class="pm-item" style="justify-content:center" onclick="closePlanMenu()">${t("tourCancel")}</button>`);
    } else {
      launchTour(ordered);
    }
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{ userPos={lat:pos.coords.latitude,lng:pos.coords.longitude}; decide(); },
      ()=>decide(), {timeout:4000, maximumAge:60000});
  } else decide();
}
function deletePlan(planId){
  if(!confirm(t("planDelQ"))) return;
  PLANS=PLANS.filter(x=>x.id!==planId); savePlans(); renderPlanView();
}

/* ============ TOUR MODE ============ */
let TOUR = {active:false, stops:[], idx:0};
try{ const s=JSON.parse(store.get("tv_tour")||"null"); if(s && s.active) TOUR=s; }catch(e){}
let selMode = false, tourSel = [], tourWatch = null, tourBadges = [];
const ARRIVE_M = 60;

function saveTour(){ store.set("tv_tour", JSON.stringify(TOUR)); }
function renderTourCtl(){
  if(!selMode){
    $("tourctl").innerHTML = `<button class="abtn sec ripple" onclick="enterSelMode()">${ic("walk",17)} ${t("tourMake")}</button>
      <button class="chip ${sortMode==='rating'?'on':''}" onclick="toggleSort()" style="padding:11px 16px">${ic("starfull",15)} ${t("sortRate")}</button>
      <button class="chip ${openMode?'on':''}" onclick="toggleOpenNow()" style="padding:11px 16px">${openMode?ic("check",14):""}🕐 ${t("openNow")}</button>
      ${openMode?`<p class="pm-disc" style="flex-basis:100%;margin:2px 4px">${hoursBusy?t("hoursLoad"):t("hoursDisc")}</p>`:""}`;
  } else {
    $("tourctl").innerHTML =
      `<button class="abtn primary ripple" onclick="startTour()" ${tourSel.length<2?"disabled style='opacity:.5'":""}>${ic("walk",17)} ${t("tourStart")} (${tourSel.length})</button>
       <button class="abtn sec ripple" onclick="exitSelMode()">${t("tourCancel")}</button>
       <p style="flex-basis:100%;color:var(--on-surface-var);font-size:12.5px;margin:2px 4px">${t("tourPick")}</p>`;
  }
}
function enterSelMode(){ selMode=true; tourSel=[]; renderTourCtl(); renderCards(); }
function exitSelMode(){ selMode=false; tourSel=[]; renderTourCtl(); renderCards(); }
function toggleSel(id){
  const i = tourSel.indexOf(id);
  i>=0 ? tourSel.splice(i,1) : tourSel.push(id);
  renderTourCtl(); renderCards();
}
function orderStops(ids, from){
  const rest = ids.map(id=>findPlace(id)).filter(Boolean);
  const route = [];
  let cur = from || {lat:rest[0].lat, lng:rest[0].lng};
  while(rest.length){
    let bi=0, bd=Infinity;
    rest.forEach((p,i)=>{ const d=haversine(cur.lat,cur.lng,p.lat,p.lng); if(d<bd){bd=d;bi=i;} });
    const p = rest.splice(bi,1)[0];
    route.push(p.id); cur=p;
  }
  return route;
}
function startTour(){
  if(tourSel.length<1) return;
  // grab a fresh position first so the route starts from where the user actually is
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{ userPos={lat:pos.coords.latitude,lng:pos.coords.longitude}; beginTour(); },
      ()=>beginTour(), {timeout:4000, maximumAge:60000});
  } else beginTour();
}
function beginTour(){
  launchTour(orderStops(tourSel, userPos));
  selMode=false; tourSel=[];
  renderTourCtl(); renderCards();
}
function launchTour(orderedStops){
  TOUR = {active:true, stops:orderedStops, idx:0};
  saveTour();
  showView("map");
  drawTour(); renderTourBar(); startTourWatch();
  const first = findPlace(TOUR.stops[0]);
  if(map && first){
    if(userPos) map.fitBounds([[Math.min(userPos.lng,first.lng),Math.min(userPos.lat,first.lat)],[Math.max(userPos.lng,first.lng),Math.max(userPos.lat,first.lat)]],{padding:80});
    else map.flyTo({center:[first.lng,first.lat], zoom:15});
  }
  speak(t("tourFollow"), lang);
}
function tourCoords(){ return TOUR.stops.map(id=>findPlace(id)).filter(Boolean).map(p=>[p.lng,p.lat]); }
function drawTour(){
  if(!map || !TOUR.active) return;
  const draw = () => {
    clearTourLayers();
    map.addSource("tour",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:tourCoords()}}});
    map.addLayer({id:"tour-line",type:"line",source:"tour",paint:{"line-color":"#6750A4","line-width":4,"line-dasharray":[1.5,1.5],"line-opacity":.85}});
    TOUR.stops.forEach((id,i)=>{
      const p=findPlace(id); if(!p) return;
      const el=document.createElement("div");
      el.className="numbadge"+(i<TOUR.idx?" done":"");
      el.textContent = i<TOUR.idx ? "✓" : (i+1);
      el.addEventListener("click",e=>{e.stopPropagation();openSheet(id)});
      tourBadges.push(new maplibregl.Marker({element:el,anchor:"center",offset:[16,-16]}).setLngLat([p.lng,p.lat]).addTo(map));
    });
  };
  map.isStyleLoaded() ? draw() : map.once("load",draw);
}
function clearTourLayers(){
  tourBadges.forEach(b=>b.remove()); tourBadges=[];
  if(map && map.getLayer && map.getLayer("tour-line")) map.removeLayer("tour-line");
  if(map && map.getSource && map.getSource("tour")) map.removeSource("tour");
}
function renderTourBar(){
  const bar=$("tourbar");
  if(!TOUR.active || TOUR.idx>=TOUR.stops.length){ bar.classList.remove("on"); return; }
  const p=findPlace(TOUR.stops[TOUR.idx]);
  $("tbnum").textContent = (TOUR.idx+1);
  $("tbname").textContent = p ? Lp(p).title : "";
  $("tbdist").textContent = (userPos&&p) ? fmtDist(haversine(userPos.lat,userPos.lng,p.lat,p.lng))+" · "+(TOUR.idx+1)+"/"+TOUR.stops.length : (TOUR.idx+1)+"/"+TOUR.stops.length;
  $("tbnext").innerHTML = ic("send",14)+t("tourNext");
  $("tbend").innerHTML = ic("close",14)+t("tourEnd");
  bar.classList.add("on");
}
function openNextStop(){ if(TOUR.active && TOUR.stops[TOUR.idx]) openSheet(TOUR.stops[TOUR.idx]); }
let annSet=new Set(), lastCenter=0;
function startTourWatch(){
  if(tourWatch!=null || !navigator.geolocation) return;
  tourWatch = navigator.geolocation.watchPosition(pos=>{
    userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(!TOUR.active) return;
    renderTourBar();
    const p=findPlace(TOUR.stops[TOUR.idx]);
    if(!p) return;
    const d=haversine(userPos.lat,userPos.lng,p.lat,p.lng);
    /* auto-center the map on the walker (throttled) */
    if(map && Date.now()-lastCenter>6000 && $("view-map").classList.contains("active")){
      lastCenter=Date.now(); map.easeTo({center:[userPos.lng,userPos.lat], duration:800});
    }
    /* one-time voice heads-up when the next stop is close */
    if(d<=250 && d>ARRIVE_M && !annSet.has(TOUR.idx)){
      annSet.add(TOUR.idx);
      speak(`${Math.round(d)} m ${t("nearNext")}: ${Lp(p).title}`, lang);
    }
    if(d <= ARRIVE_M) arriveAtStop();
  }, e=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}
function ding(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.setValueAtTime(.25,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+.6);
  }catch(e){}
}

function arriveAtStop(){
  const p=findPlace(TOUR.stops[TOUR.idx]); if(!p) return;

  try{ navigator.vibrate && navigator.vibrate([200,100,200]) }catch(e){}
  openSheet(p.id);
  speak(t("tourArrived")+": "+Lp(p).title+". "+Lp(p).story+" … "+Lp(p).tip, lang, Lp(p).title);

}

function resolveCityKey(name, lat, lng){
  const q=String(name||"").trim().toLowerCase();
  if(!q) return null;
  const hit=Object.keys(CITIES).find(k=>CITIES[k].name.toLowerCase()===q);
  if(hit) return hit;
  if(!isFinite(+lat)||!isFinite(+lng)) return null;
  if(Object.keys(CUSTOM_CITIES).length>=10) return null;
  const key="c-"+q.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  CUSTOM_CITIES[key]={name:String(name).trim(), center:[+lng,+lat], zoom:13, custom:true};
  CITIES=Object.assign({}, BUILT_CITIES, EURO_CITIES, CUSTOM_CITIES);
  store.set("tv_cities", JSON.stringify(CUSTOM_CITIES));
  return key;
}
async function addPlacesFromAI(inp){
  try{
    const key=resolveCityKey(inp.city_name, inp.city_lat, inp.city_lng);
    if(!key) return "ERROR: could not resolve the city (missing center coordinates or city limit reached)";
    const raw=(inp.places||[]).filter(x=>x&&x.name);
    const verified=await verifyPlaces(raw, CITIES[key].center);
    const dropped=raw.length-verified.length;
    const added=verified.filter(x=>isFinite(+x.lat)&&isFinite(+x.lng)).map((x,i)=>{
      const lb={title:String(x.name), story:String(x.story||x.name), tip:String(x.tip||"")};
      return { id:"ai-add-"+Date.now()+"-"+i, ai:true, city:key, cat:(CAT_ICON[x.cat]?x.cat:"landmark"), lat:+x.lat, lng:+x.lng, wiki:null, sr:lb, en:lb };
    });
    if(!added.length) return "ERROR: none of the places could be verified on the map — they may not exist in "+CITIES[key].name+". Tell the user honestly that you couldn't verify them and do NOT claim they were added.";
    CITY_PLACES[key]=(CITY_PLACES[key]||[]).concat(added);
    store.set("tv_cityplaces", JSON.stringify(CITY_PLACES));
    window._lastAddKey=key;
    if(key===city){ renderChips(); renderCards(); renderMarkers(); renderInfo(); }
    return `OK: added ${added.length} map-verified places to ${CITIES[key].name}${dropped?` (${dropped} could not be verified on the map and were discarded — tell the user)`:""}${key!==city?" (user can switch city via the top button)":""}.`;
  }catch(e){ return "ERROR: "+e.message; }

async function createTourFromAI(inp){
  try{
    /* split stops into known (by id) and new; verify the new ones against the map */
    const rawNew=(inp.stops||[]).filter(s=>!(s.id&&findPlace(s.id))&&s&&s.name);
    const verifiedNew=await verifyPlaces(rawNew, CITIES[city].center);
    const okNames=new Set(verifiedNew.map(v=>v.name));
    const stopIds=[]; let droppedNames=[];
    (inp.stops||[]).forEach((s,i)=>{
      const existing = s.id && findPlace(s.id);
      if(existing){ stopIds.push(existing.id); return; }
      if(!s || !s.name) return;
      if(!okNames.has(s.name)){ droppedNames.push(s.name); return; }
      const v=verifiedNew.find(x=>x.name===s.name);
      const lb={title:String(s.name), story:String(s.story||s.name), tip:String(s.tip||"")};
      const p={ id:"ai-chat-"+Date.now()+"-"+i, ai:true, city, cat:(CAT_ICON[s.cat]?s.cat:"landmark"), lat:+v.lat, lng:+v.lng, wiki:null, sr:lb, en:lb };
      SAVED.push(p); stopIds.push(p.id);
    });
    store.set("tv_saved", JSON.stringify(SAVED));
    if(!stopIds.length) return "ERROR: no valid stops (none could be verified on the map)";
    const dropNote = droppedNames.length ? ` NOTE: ${droppedNames.length} stops (${droppedNames.join(", ")}) could not be verified on the map and were excluded — mention this to the user.` : "";
    if(inp.start_now){
      launchTour(stopIds);
      return `OK: tour "${inp.name}" started now with ${stopIds.length} stops. The user is now on the map view.${dropNote}`;
    }
    PLANS.push({id:"plan-"+Date.now(), name:String(inp.name||"Tura"), city, stops:stopIds});
    savePlans(); renderPlanView(); renderCards(); renderMarkers();
    return `OK: plan "${inp.name}" saved with ${stopIds.length} stops. The user can open it in the "${t("plan")}" tab and press "${t("startPlanBtn")}".${dropNote}`;
  }catch(e){ return "ERROR: "+e.message; }
}

/* SSE streaming call — live text into the bubble, tool_use blocks accumulated for the agent loop */
async function streamAnthropic(payload, key, onText){
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body:JSON.stringify(Object.assign({stream:true}, payload))
  });
  if(!r.ok){ const e=await r.text(); throw new Error(e.slice(0,200)); }
  const reader=r.body.getReader(), dec=new TextDecoder();
  let buf="", blocks=[], stop_reason=null, liveText="";
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    const parts=buf.split("\n\n"); buf=parts.pop();
    for(const part of parts){
      const dl=part.split("\n").find(l=>l.startsWith("data:")); if(!dl) continue;
      let ev; try{ ev=JSON.parse(dl.slice(5).trim()) }catch(e){ continue; }
      if(ev.type==="content_block_start"){ blocks[ev.index]=Object.assign({_json:""}, ev.content_block); if(ev.content_block.type==="text") blocks[ev.index].text=ev.content_block.text||""; }
      else if(ev.type==="content_block_delta"){
        const b=blocks[ev.index]; if(!b) continue;
        if(ev.delta.type==="text_delta"){ b.text=(b.text||"")+ev.delta.text; liveText=blocks.filter(x=>x&&x.type==="text").map(x=>x.text).join(""); if(onText) onText(liveText); }
        else if(ev.delta.type==="input_json_delta"){ b._json+=ev.delta.partial_json||""; }
      }
      else if(ev.type==="message_delta" && ev.delta && ev.delta.stop_reason) stop_reason=ev.delta.stop_reason;
    }
  }
  const content=blocks.filter(Boolean).map(b=>{
    if(b.type==="tool_use"){ let input={}; try{ input=b._json?JSON.parse(b._json):(b.input||{}) }catch(e){}
      return {type:"tool_use", id:b.id, name:b.name, input}; }
    return {type:"text", text:b.text||""};
  });
  return {content, stop_reason};
}
async function runChatTurn(tw, key){
  try{
    let madePlan=false, madeAdd=false, guard=0, reply="";
    while(guard++ < 4){
      const j = await streamAnthropic({ model: store.get("tv_model")||"claude-haiku-4-5",
          max_tokens:4000, system: sysPrompt(), tools:[TOUR_TOOL, ADD_TOOL], messages: buildMsgs() },
        key,
        txt=>{ tw.innerHTML = esc(txt)+`<span style="opacity:.5">▌</span>`; $("chatlog").scrollTop=$("chatlog").scrollHeight; });
      const toolUses = (j.content||[]).filter(b=>b.type==="tool_use");
      if(j.stop_reason==="tool_use" && toolUses.length){
        chatHistory.push({role:"assistant",content:j.content});
        const results = await Promise.all(toolUses.map(async tu=>{
          let res="ERROR: unknown tool";
          if(tu.name==="create_tour"){ res=await createTourFromAI(tu.input||{}); if(String(res).startsWith("OK")) madePlan=true; }
          if(tu.name==="add_places"){ res=await addPlacesFromAI(tu.input||{}); if(String(res).startsWith("OK")) madeAdd=true; }
          return {type:"tool_result", tool_use_id:tu.id, content:String(res)};
        }));
        chatHistory.push({role:"user",content:results});
        continue;
      }
      reply = (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
      chatHistory.push({role:"assistant",content:reply});
      break;
    }
    const planBtn = madePlan ? `<button onclick="showView('plan')" style="background:var(--primary);border:none;color:#fff;border-radius:16px;padding:6px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;font-family:inherit;margin-right:6px">${ic("event",14)} ${t("openPlanB")}</button>` :
      (madeAdd ? `<button onclick="openAddedList()" style="background:var(--primary);border:none;color:#fff;border-radius:16px;padding:6px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;font-family:inherit;margin-right:6px">${ic("book",14)} ${t("openListB")}</button>` : "");
    tw.innerHTML = esc(reply) + `<div style="margin-top:8px">${planBtn}<button onclick="speakLast(this)" data-txt="${esc(reply).replace(/"/g,'&quot;')}" style="background:none;border:1px solid var(--outline-var);color:var(--on-surface-var);border-radius:16px;padding:6px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;font-family:inherit">${ic("volume",14)} ${t("listen")}</button></div>`;
  }catch(e){
    tw.className="msg sys"; tw.textContent = t("chatErr") + " (" + e.message.slice(0,120) + ")";
    chatHistory.pop();
  }
  saveChat();
  $("chatlog").scrollTop=$("chatlog").scrollHeight;
}

<script>
/* Material ripple effect */
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".ripple, .card, .chip, nav button");
  if(!el) return;
  if(el.classList.contains("maptab")) return; // FAB must keep overflow visible — ripple would clip it
  el.classList.contains("ripple") || el.classList.add("ripple");
  const r = el.getBoundingClientRect();
  const s = document.createElement("span");
  s.className = "rp";
  const size = Math.max(r.width, r.height);
  s.style.width = s.style.height = size + "px";
  s.style.left = (e.clientX - r.left - size/2) + "px";
  s.style.top = (e.clientY - r.top - size/2) + "px";
  el.appendChild(s);
  setTimeout(() => s.remove(), 550);
});
</script>
